<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Public Wall</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #273c75;
      --primary-hover: #40739e;
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --text-light: #7f8fa6;
      --border-color: #dfe4ea;
      --success-color: #43a047;
      --danger-color: #c23616;
      --danger-hover: #e84118;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      --header-height: 60px;
    }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: var(--header-height); 
    }
    header {
      /* --- FIXED HEADER CSS --- */
      position: fixed; 
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      z-index: 1000; 
      
      background-color: var(--primary-color);
      color: white;
      padding: 18px 30px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      box-sizing: border-box; 
    }
    header .header-controls {
      display: flex;
      gap: 15px;
    }
    .container {
      padding: 30px 10%; 
      margin: 0 auto; 
    }
    .btn {
      font-family: "Poppins", sans-serif;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-danger {
      background-color: var(--danger-color);
      color: white;
    }
    .btn-danger:hover {
      background-color: var(--danger-hover);
    }
    
    /* Public Wall - Use larger max-width for the main content card */
    #public-wall {
      max-width: 1200px; 
      width: 100%;
      margin: 20px auto;
      background: var(--card-bg);
      border-radius: 15px;
      padding: 30px;
      box-shadow: var(--shadow);
    }
    #public-wall h2 {
      color: var(--primary-color);
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* Wallet Area */
    #wallet-info {
      background-color: var(--bg-color);
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    #wallet-info span {
      font-size: 14px;
      color: var(--text-light);
    }
    #wallet-info strong {
      font-size: 16px;
      color: var(--text-color);
      font-weight: 600;
      margin-left: 8px;
    }

    /* Post Composer - Now a modal-like structure */
    #postComposer {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      z-index: 1010;
      display: none; /* Hide by default */
    }
    #postComposer textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      font-family: "Poppins", sans-serif;
      box-sizing: border-box;
      resize: vertical;
    }
    #postComposer textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(39, 60, 117, 0.2);
    }
    #composer-footer {
      display: flex;
      justify-content: flex-end; /* Align buttons to the right */
      gap: 10px;
      align-items: center;
      margin-top: 15px;
    }
    #postingStatus {
      font-size: 14px;
      font-weight: 500;
      margin-right: auto; /* Push status to the left */
    }
    #postingStatus.success { color: var(--success-color); }
    #postingStatus.error { color: var(--danger-color); }

    /* Floating Action Button (FAB) */
    #fabButton {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--primary-color);
      color: white;
      font-size: 30px;
      line-height: 60px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 999;
      display: none; /* Hidden until wallet is connected */
    }
    #fabButton:hover {
        background-color: var(--primary-hover);
    }

    /* Post List */
    #postList {
      margin-top: 20px;
      min-height: 200px; 
    }
    .post-item {
      border: 1px solid var(--border-color);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      background: #fdfdfd;
      word-wrap: break-word;
      position: relative; 
    }
    .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 5px 10px;
      font-size: 12px;
    }
    #no-posts {
      text-align: center;
      padding: 30px;
      color: var(--text-light);
    }
    .post-comments-section {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }
    .comment-list {
      background: #fcfcfc;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      max-height: 150px; 
      overflow-y: auto;
    }
    .comment-item {
      padding: 5px 0;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .comment-composer {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .comment-composer input {
      flex-grow: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: "Poppins", sans-serif;
    }
    .btn-reaction {
      padding: 5px 10px !important; 
      font-size: 13px !important;
      margin-top: 10px;
    }
    .status-message {
      font-size: 12px;
      margin-top: 5px;
      display: block;
      font-weight: 500;
    }
    .status-message.success { color: var(--success-color); }
    .status-message.error { color: var(--danger-color); }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-light);
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <span>🎓 University Portal</span>
    <div class="header-controls">
      
      <!-- NEW BUTTON: Link to the File Submission Portal -->
      <button class="btn btn-primary" onclick="window.location.href='files.html'" style="background-color: var(--success-color); color: white;">
        📁 Assignments
      </button>
      
      <button class="btn btn-primary" onclick="window.location.href='admin.html'" style="background-color: #ffb300; color: #333;">
        🔐 Admin Panel
      </button>
      <button class="btn btn-danger" onclick="logout()">
        Logout
      </button>
    </div>
  </header>

  <div class="container">
    <div id="public-wall">
      <h2>🌐 University Public Wall</h2>

      <div id="wallet-info">
        <span id="wallet-status">
          Status: <strong>Disconnected</strong>
        </span>
        <button id="connectButton" class="btn btn-primary">Connect Wallet</button>
      </div>
    </div>
    
    <!-- Floating Action Button (FAB) -->
    <button id="fabButton" onclick="togglePostComposer(true)">+</button>
    
    <!-- Post Composer (Now positioned fixed/absolute like a modal) -->
    <div id="postComposer">
        <h3 style="margin-top: 0;">Share Your Update</h3>
        <textarea id="postInput" placeholder="Type your post here..."></textarea>
        <div id="composer-footer">
          <span id="postingStatus"></span>
          <button class="btn btn-danger" onclick="togglePostComposer(false)">Cancel</button>
          <button id="postButton" class="btn btn-primary">Post to Wall</button>
        </div>
    </div>

    <!-- The list needs to be outside the main wall card to ensure correct centering -->
    <div id="postList">
      <p id="no-posts">Loading posts...</p>
    </div>
    
  </div>

  <footer>© 2025 Secure Portal | Posts are stored on the blockchain.</footer>

  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <script>
    function logout() {
      sessionStorage.removeItem('isWalletConnected'); 
      alert("Logging out and returning to login page...");
      window.location.href = "index.html";
    }

    // --- BLOCKCHAIN WALL (Ethers v5 with Comments/Reactions) ---
    
    // ⚠️ CONTRACT ADDRESS: Replaced with the new address 0xF25AB40f6648CeeDcf1166aC19634DcBBE2B0ac1
    const CONTRACT_ADDRESS = "0xF25AB40f6648CeeDcf1166aC19634DcBBE2B0ac1"; 

    // MODIFIED: Updated ABI with new functions and events for comments/reactions
    const ABI = [
      "function addPost(string calldata _text) external",
      "function deletePost(uint256 index) external",
      "function addComment(uint256 index, string calldata _text) external", 
      "function toggleReaction(uint256 index) external", 
      "function getPostCount() view returns (uint256)",
      "function getPostDetails(uint256 index) view returns (address author, string memory text, uint256 timestamp, bool isDeleted, tuple(address author, string text, uint256 timestamp)[] comments, uint256 reactionCount)", 
      "event PostCreated(uint256 indexed index, address indexed author, uint256 timestamp, string text)",
      "event PostDeleted(uint256 indexed index, address indexed author)",
      "event CommentAdded(uint256 indexed postIndex, address indexed author, uint256 timestamp, string text)", 
      "event ReactionToggled(uint256 indexed postIndex, address indexed user, bool added)" 
    ];

    let provider, signer, contract, currentAccount; 

    const connectButton = document.getElementById("connectButton");
    const walletStatus = document.getElementById("wallet-status");
    const postComposer = document.getElementById("postComposer");
    const postButton = document.getElementById("postButton");
    const postInput = document.getElementById("postInput");
    const postList = document.getElementById("postList");
    const postingStatus = document.getElementById("postingStatus");
    const noPosts = document.getElementById("no-posts");
    const fabButton = document.getElementById("fabButton");

    // NEW FUNCTION: Toggles the visibility of the post composer
    function togglePostComposer(show) {
        if (show) {
            postComposer.style.display = "block";
            postInput.focus();
        } else {
            postComposer.style.display = "none";
            postInput.value = ""; // Clear input on cancel/close
            setPostingStatus("", null);
        }
    }

    async function init() {
      if (typeof window.ethereum === "undefined") {
        connectButton.innerText = "Install MetaMask";
        connectButton.onclick = () => window.open("https://metamask.io/");
        walletStatus.innerHTML = "<strong>MetaMask Not Found</strong>";
        noPosts.textContent = "Please install MetaMask to use the Public Wall.";
        return;
      }
      
      provider = new ethers.providers.Web3Provider(window.ethereum);
      connectButton.onclick = connectWallet;
      
      try {
        const readOnlyContract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
        await loadPosts(readOnlyContract);
      } catch (e) {
        console.error("Error loading read-only contract", e);
        if(noPosts) noPosts.textContent = "Error loading contract. Is the address correct?";
      }

      if (sessionStorage.getItem('isWalletConnected') === 'true') {
        connectWallet();
      }
    }

    async function connectWallet() {
      try {
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        
        currentAccount = await signer.getAddress(); 
        walletStatus.innerHTML = `Connected: <strong>${shortAddr(currentAccount)}</strong>`;
        connectButton.style.display = "none";
        fabButton.style.display = "block"; // Show FAB after connection
        sessionStorage.setItem('isWalletConnected', 'true');
        
        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

        contract.on("PostCreated", () => loadPosts(contract));
        contract.on("PostDeleted", () => loadPosts(contract));
        contract.on("CommentAdded", () => loadPosts(contract)); 
        contract.on("ReactionToggled", () => loadPosts(contract)); 

        await loadPosts(contract); 

      } catch (err) {
        console.error("Connection error:", err);
        walletStatus.innerHTML = "<strong>Connection Failed</strong>";
        sessionStorage.removeItem('isWalletConnected');
        currentAccount = null; 
        fabButton.style.display = "none"; // Hide FAB on disconnection
      }
    }

    postButton.addEventListener("click", async () => {
      if (!contract) return alert("Please connect your wallet first.");
      const message = postInput.value.trim();
      if (!message) return alert("Please enter something to post.");
      
      try {
        setPostingStatus("Posting to blockchain...", null);
        const tx = await contract.addPost(message);
        await tx.wait();
        setPostingStatus("Posted Successfully!", "success");
        togglePostComposer(false); // Hide composer after successful post
      } catch (err) {
        console.error("Post error:", err);
        setPostingStatus(`Transaction Failed: ${err.reason || err.message}`, "error");
        setTimeout(() => setPostingStatus("", null), 5000); 
      }
    });

    async function loadPosts(contractInstance) {
       if(!contractInstance) return; 
       if(noPosts) noPosts.textContent = "Loading posts from the blockchain...";
       postList.innerHTML = ""; 
       postList.appendChild(noPosts); 
      
      try {
        const countBigNum = await contractInstance.getPostCount();
        const count = countBigNum.toNumber();
        
        let visiblePostCount = 0;
        const postsToRender = []; 

        for (let i = count - 1; i >= 0; i--) {
          const [author, text, ts, isDeleted, comments, reactionCount] = await contractInstance.getPostDetails(i);
          
          if (!isDeleted) {
              postsToRender.push({ 
                  index: i, 
                  author, 
                  text, 
                  timestamp: ts.toNumber(),
                  comments,         
                  reactionCount: reactionCount.toNumber() 
              });
              visiblePostCount++;
          }
        }
        
        postList.innerHTML = ""; 

        if (visiblePostCount === 0) {
          if(noPosts) noPosts.textContent = "No posts yet. Be the first!";
          postList.appendChild(noPosts);
        } else {
            postsToRender.forEach(post => appendPostToUI(post));
        }

      } catch (err) {
        console.error("Load posts error:", err);
        if(noPosts) noPosts.textContent = "Error: Could not load posts. Is the contract address correct and deployed?";
        postList.innerHTML = ""; 
        postList.appendChild(noPosts); 
      }
    }

    function appendPostToUI({ index, author, text, timestamp, comments, reactionCount }) {
      const d = new Date(timestamp * 1000);
      const el = document.createElement("div");
      el.className = "post-item";
      el.id = `post-${index}`; 

      let deleteButtonHtml = '';
      if (currentAccount && author.toLowerCase() === currentAccount.toLowerCase()) {
        deleteButtonHtml = `<button class="btn btn-danger delete-btn" onclick="handleDelete(${index})">Delete</button>`;
      }

      let commentsHtml = comments.map(c => {
          const commentDate = new Date(c.timestamp.toNumber() * 1000).toLocaleString();
          return `<div class="comment-item">
              <strong>${shortAddr(c.author)}:</strong> ${escapeHtml(c.text)}
              <span style="float: right; color: var(--text-light); font-size: 11px;">${commentDate}</span>
          </div>`;
      }).join('');


      el.innerHTML = `
        ${deleteButtonHtml} 
        <div class="post-header">
          <strong>${shortAddr(author)}</strong> • ${d.toLocaleString()}
        </div>
        <div class="post-content">${escapeHtml(text)}</div>

        <button class="btn btn-primary btn-reaction" onclick="handleReaction(${index})">
          👍 React (${reactionCount})
        </button>

        <div class="post-comments-section">
            <h4 style="margin-top: 15px; margin-bottom: 5px; color: var(--primary-color);">Comments (${comments.length})</h4>
            <div class="comment-list">
                ${commentsHtml || '<div class="comment-item" style="color:var(--text-light); text-align: center;">No comments yet.</div>'}
            </div>
            <!-- Comment Input Form -->
            <div class="comment-composer">
                <input type="text" id="comment-input-${index}" placeholder="Add a comment..." />
                <button class="btn btn-primary" onclick="handleComment(${index})">Comment</button>
            </div>
            <span id="comment-status-${index}" class="status-message"></span>
        </div>`;
      postList.appendChild(el);
    }
    
    async function handleDelete(index) {
      if (!contract) return alert("Please connect your wallet first.");
      if (!confirm("Are you sure you want to delete this post? This action cannot be undone on the blockchain.")) return;

      try {
        setPostingStatus("Deleting post...", null);
        const tx = await contract.deletePost(index);
        await tx.wait();
        setPostingStatus("Post deleted!", "success");
        
        const postElement = document.getElementById(`post-${index}`);
        if (postElement) postElement.remove();
        
        if (postList.children.length === 0) {
             if(noPosts) noPosts.textContent = "No posts yet. Be the first!";
             postList.appendChild(noPosts);
        }

        setTimeout(() => setPostingStatus("", null), 3000);
      } catch (err) {
        console.error("Delete error:", err);
        setPostingStatus(`Delete Failed: ${err.reason || err.message}`, "error");
        setTimeout(() => setPostingStatus("", null), 5000);
      }
    }

    async function handleComment(index) {
      if (!contract) return alert("Please connect your wallet first.");
      const inputEl = document.getElementById(`comment-input-${index}`);
      const statusEl = document.getElementById(`comment-status-${index}`);
      const comment = inputEl.value.trim();
      
      if (!comment) {
        statusEl.textContent = "Comment cannot be empty.";
        statusEl.className = 'error';
        setTimeout(() => statusEl.textContent = "", 3000);
        return;
      }

      try {
        statusEl.textContent = "Sending comment transaction... Confirm in MetaMask.";
        statusEl.className = 'success';
        
        const tx = await contract.addComment(index, comment);
        await tx.wait();
        
        statusEl.textContent = "Comment posted successfully! Refreshing...";
        inputEl.value = ""; 
        setTimeout(() => statusEl.textContent = "", 3000);
        
      } catch (err) {
        console.error("Comment error:", err);
        statusEl.textContent = `Comment Failed: ${err.error?.message || err.message}`;
        statusEl.className = 'error';
        setTimeout(() => statusEl.textContent = "", 5000);
      }
    }

    async function handleReaction(index) {
      if (!contract) return alert("Please connect your wallet first.");
      const postEl = document.getElementById(`post-${index}`);
      const reactionButton = postEl.querySelector('.btn-reaction');
      
      try {
        const confirmMsg = "Confirm transaction to toggle your reaction (Like/Unlike)? This will cost gas.";
        if (!confirm(confirmMsg)) return;
        
        reactionButton.textContent = "Processing...";

        const tx = await contract.toggleReaction(index);
        await tx.wait();
        
      } catch (err) {
        console.error("Reaction error:", err);
        alert(`Reaction Failed: ${err.error?.message || err.message}`);
        loadPosts(contract); 
      }
    }

    function setPostingStatus(message, type) { 
      postingStatus.textContent = message;
      postingStatus.className = type || ''; 
    }

    function escapeHtml(unsafe) {
      if (typeof unsafe !== 'string') return '';
      return unsafe
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function shortAddr(a) {
      return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "";
    }

    window.addEventListener("DOMContentLoaded", init);

     if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', (accounts) => {
             window.location.reload(); 
             if(accounts.length === 0) {
                 sessionStorage.removeItem('isWalletConnected');
             }
        });
        window.ethereum.on('chainChanged', () => {
            window.location.reload();
        });
    }
  </script>
</body>
</html>
