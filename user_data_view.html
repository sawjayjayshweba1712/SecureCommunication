<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Data View - Admin/Teacher Only</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <!-- Firebase Core Imports for live data storage -->
  <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; padding: 20px; background: #f4f6fb; color: #2f3640; }
    .container { max-width: 1200px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06); }
    h1 { color: #273c75; border-bottom: 2px solid #dfe4ea; padding-bottom: 10px; margin-top: 0; }
    #status { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; }
    .err { background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; }
    .ok { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #dfe4ea; padding: 12px; text-align: left; font-size: 14px; }
    th { background-color: #273c75; color: white; font-weight: 500; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    /* CRUD Button Styles */
    .btn { padding: 10px 14px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background-color 0.2s;}
    .btn-back { background: #6c757d; color: #fff; margin-right: 10px; }
    .btn-back:hover { background: #5a6268; }
    .btn-primary { background: #1e88e5; color: #fff; }
    .btn-primary:hover { background: #1565c0; }
    .btn-add { background: #28a745; color: #fff; }
    .btn-add:hover { background: #218838; }
    .btn-edit { background: #ffc107; color: #212529; font-size: 12px; margin-right: 5px; }
    .btn-edit:hover { background: #e0a800; }
    .btn-delete { background: #dc3545; color: #fff; font-size: 12px; }
    .btn-delete:hover { background: #c82333; }
    .action-cell { white-space: nowrap; }
    
    /* Modal styles */
    .modal-backdrop {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1050; display: none;
    }
    .modal {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 25px; border-radius: 10px; z-index: 1060; width: 90%; max-width: 450px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .modal input {
        width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;}
    .modal h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 0; color: #273c75; }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    <h1>📋 Student Data Management (Firestore)</h1>
    
    <div id="status" class="err">Initializing services...</div>
    
    <div id="content-area" style="display:none;">
        <p>Access Granted for Role: <strong id="userRole"></strong></p>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <p style="font-style: italic; color: #5a6268;">Data is managed here and stored in Firestore.</p>
            <button class="btn btn-add" onclick="showModal()">+ Add New Student Record</button>
        </div>
        
        <table id="userDataTable">
            <thead>
                <tr>
                    <!-- TABLE HEADERS MATCHING THE USER'S REQUESTED LAYOUT -->
                    <th>Address</th>
                    <th>Name / Age</th>
                    <th>Role (On-Chain)</th>
                    <th>Course Enrolled</th>
                    <th>Status / Last Access</th>
                    <th>Profile CID</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr><td colspan="7" style="text-align: center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

  </div>
  
  <!-- Modal for Add/Edit -->
  <div id="editModal" class="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 id="modalTitle">Add New Student</h2>
      <input type="hidden" id="docId">
      
      <label>Wallet Address (0x...):</label>
      <input type="text" id="inputAddress" placeholder="0x..." maxlength="42">
      
      <label>Age:</label>
      <input type="number" id="inputAge" placeholder="20" min="18" max="100">
      
      <label>Course:</label>
      <input type="text" id="inputCourse" placeholder="Quantum Computing">
      
      <label>Status:</label>
      <input type="text" id="inputStatus" placeholder="Active / On Leave / Graduated">
      
      <div id="modal-status" class="err" style="display: none;"></div>
      
      <div class="modal-footer">
        <button class="btn btn-back" onclick="closeModal()">Cancel</button>
        <button class="btn btn-add" id="saveButton" onclick="saveStudent()">Save Student</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- GLOBAL VARIABLES (Provided by Canvas Environment) ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    
    // --- CONTRACT SETUP ---
    // ⚠️ AuthManager Contract Address
    const CONTRACT_ADDRESS = "0xd1968a1b2250233500D4dd3967012928e87Ef66c"; 
    const CONTRACT_ABI = [ 
        "function getMyRole() external view returns (string memory)",
        "function getRole(address user) external view returns (string memory)"
    ];

    // --- FIREBASE GLOBALS ---
    let db, auth, currentUserId;
    const STUDENT_COLLECTION_PATH = `artifacts/${appId}/public/data/student_data`;

    // --- Ethers Globals ---
    let ethersProvider, currentEthAccount, contract;

    // --- UI UTILITIES ---
    function shortAddr(a) { return a && a.length === 42 ? `${a.slice(0, 6)}...${a.slice(-4)}` : a || "N/A"; }
    function el(id){ return document.getElementById(id); }
    function setStatus(t, ok=true){ el('status').textContent=t; el('status').className=ok?'ok':'err'; }
    function setModalStatus(t, ok=true, duration=3000){ 
        const statusEl = el('modal-status');
        statusEl.textContent = t; 
        statusEl.className = ok ? 'ok' : 'err';
        statusEl.style.display = 'block';
        if (duration > 0) setTimeout(() => statusEl.style.display = 'none', duration);
    }

    // --- MODAL FUNCTIONS ---
    window.showModal = (student = null) => {
        el('modalTitle').textContent = student ? 'Edit Student Details' : 'Add New Student';
        el('docId').value = student ? student.id : '';
        el('inputAddress').value = student ? student.address : '';
        el('inputAddress').disabled = student; // Cannot change address on edit
        el('inputAge').value = student ? student.age : '';
        el('inputCourse').value = student ? student.course : '';
        el('inputStatus').value = student ? student.status : '';
        el('saveButton').textContent = student ? 'Update Details' : 'Save Student';
        el('editModal').style.display = 'block';
        el('modal-status').style.display = 'none';
        el('inputAddress').focus();
    }

    window.closeModal = () => {
        el('editModal').style.display = 'none';
    }

    // --- FIRESTORE CRUD OPERATIONS ---

    async function saveStudent() {
        const docId = el('docId').value;
        const address = el('inputAddress').value.trim();
        const age = el('inputAge').value.trim();
        const course = el('inputCourse').value.trim();
        const status = el('inputStatus').value.trim();

        if (!ethers.utils.isAddress(address)) {
            return setModalStatus('Error: Invalid Ethereum address.', false);
        }
        if (!age || !course || !status) {
            return setModalStatus('Error: All fields must be filled.', false);
        }
        
        el('saveButton').disabled = true;

        const studentData = {
            address: address.toLowerCase(),
            age: parseInt(age),
            course,
            status,
            // Mock/Display fields to fit the table structure:
            name: `Student ID ${shortAddr(address)}`, 
            profileCID: 'N/A', 
            last_access: new Date().toLocaleString(), 
            // Audit fields
            updatedBy: currentUserId,
            updatedAt: Date.now()
        };

        try {
            if (docId) {
                // UPDATE operation
                await setDoc(doc(db, STUDENT_COLLECTION_PATH, docId), studentData, { merge: true });
                setModalStatus('Student updated successfully!', true);
            } else {
                // ADD operation 
                await addDoc(collection(db, STUDENT_COLLECTION_PATH), studentData);
                setModalStatus('Student added successfully!', true);
            }
            // Close modal after a short delay to show success
            setTimeout(closeModal, 1000); 

        } catch (e) {
            console.error("Save/Update Error:", e);
            setModalStatus(`Database Error: ${e.message}`, false);
        } finally {
            el('saveButton').disabled = false;
        }
    }

    window.deleteStudent = async (docId, address) => {
        console.warn(`Attempting to delete record for ${shortAddr(address)}...`);

        try {
            await deleteDoc(doc(db, STUDENT_COLLECTION_PATH, docId));
            setStatus(`Record for ${shortAddr(address)} deleted.`, true);
        } catch (e) {
            console.error("Delete Error:", e);
            setStatus(`Delete Failed: ${e.message}`, false);
        }
    }

    // --- DATA DISPLAY ---

    async function getOnChainRole(address) {
        try {
            const role = await contract.getRole(address);
            return role || 'member';
        } catch (e) {
            return 'member'; 
        }
    }

    function setupRealtimeListener() {
        const dataTableBody = el('dataTableBody');
        const q = query(collection(db, STUDENT_COLLECTION_PATH));
        
        onSnapshot(q, async (snapshot) => {
            dataTableBody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Processing data...</td></tr>';
            
            if (snapshot.empty) {
                dataTableBody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No student records found. Click "Add New Student Record" to begin.</td></tr>';
                setStatus('Ready to add new student records.', true);
                return;
            }

            const students = [];
            snapshot.forEach(doc => students.push({...doc.data(), id: doc.id}));

            // Fetch on-chain roles in parallel
            const rolePromises = students.map(student => getOnChainRole(student.address));
            const roles = await Promise.all(rolePromises);
            
            // Map roles back to students
            const studentsWithRoles = students.map((student, index) => ({
                ...student,
                onChainRole: roles[index]
            }));

            // Sort data by course for presentation
            studentsWithRoles.sort((a, b) => (a.course > b.course) ? 1 : ((b.course > a.course) ? -1 : 0));

            dataTableBody.innerHTML = ''; // Clear processing message

            studentsWithRoles.forEach(student => {
                const row = dataTableBody.insertRow();
                
                // 1. Address
                row.insertCell().textContent = shortAddr(student.address); 
                
                // 2. Name / Age (Maps to original 'Name' column)
                row.insertCell().innerHTML = `<strong>${student.name || 'N/A'}</strong><br><small>Age: ${student.age || 'N/A'}</small>`;
                
                // 3. Role (On-Chain) (Maps to original 'Role (On-Chain)' column)
                row.insertCell().textContent = student.onChainRole || 'N/A';
                
                // 4. Course Enrolled (Maps to original 'Course Enrolled' column)
                row.insertCell().textContent = student.course || 'N/A';
                
                // 5. Status / Last Access (Maps to original 'Last Access' column)
                row.insertCell().innerHTML = `<strong>${student.status || 'N/A'}</strong><br><small>${student.last_access || 'N/A'}</small>`;
                
                // 6. Profile CID (Mocked to N/A) (Maps to original 'Profile CID' column)
                row.insertCell().textContent = student.profileCID || 'N/A';

                const actionCell = row.insertCell();
                actionCell.className = 'action-cell';
                
                // Edit Button
                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-edit';
                editBtn.textContent = 'Edit';
                editBtn.onclick = () => showModal(student);

                // Delete Button
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-delete';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => deleteStudent(student.id, student.address);

                actionCell.appendChild(editBtn);
                actionCell.appendChild(deleteBtn);
            });
            setStatus(`Student data synchronized in real-time. Total records: ${students.length}`, true);
        }, (error) => {
            console.error("Firestore Realtime Listener Error:", error);
            setStatus(`Failed to subscribe to data: ${error.message}`, false);
        });
    }

    // --- INITIALIZATION ---

    async function init() {
        if (typeof window.ethereum === "undefined") {
            setStatus("MetaMask not installed. Please install it and refresh.", false);
            return;
        }

        try {
            // 1. Firebase Initialization & Authentication
            setStatus('Initializing Firebase services...', true);
            setLogLevel('debug');
            const firebaseApp = initializeApp(firebaseConfig);
            auth = getAuth(firebaseApp);
            db = getFirestore(firebaseApp);

            // Authentication with Firebase (silent or token-based)
            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }
            currentUserId = auth.currentUser?.uid || 'anonymous-user';

            // 2. Ethers & Role Check
            setStatus('Connecting wallet and verifying role...', true);
            ethersProvider = new ethers.providers.Web3Provider(window.ethereum);
            
            // Request accounts (this is usually where a failure happens if MetaMask is locked)
            await ethersProvider.send("eth_requestAccounts", []);
            currentEthAccount = await ethersProvider.getSigner().getAddress();
            
            contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, ethersProvider);
            
            // Check role on the blockchain
            const userRole = await contract.getMyRole({ from: currentEthAccount });
            
            // 3. Authorization Check and Data Loading
            if (userRole === 'admin' || userRole === 'teacher') {
                el('userRole').textContent = userRole.toUpperCase();
                setStatus(`Access Granted. Role: ${userRole.toUpperCase()}. Loading student data...`, true);
                el('content-area').style.display = 'block';
                setupRealtimeListener(); 
            } else {
                setStatus(`Access Denied. Your role is '${userRole || 'member'}'. Only Admin/Teacher can modify this data.`, false);
            }

        } catch (error) {
            console.error("Critical Initialization Error:", error);
            
            let displayError = 'Unknown error during startup.';
            if (error.code === 4001) {
                displayError = 'MetaMask connection rejected by user.';
            } else if (error.message.includes("network")) {
                 displayError = 'Connection failed. Check MetaMask network and ensure the contract address is correct.';
            } else {
                displayError = `Initialization failed. Check console for details.`;
            }

            setStatus(`ERROR: ${displayError}`, false);
        }
    }

    window.onload = init;
    
    // Global exposure for event handlers
    window.saveStudent = saveStudent;
    window.deleteStudent = window.deleteStudent;
    window.showModal = window.showModal;
    window.closeModal = closeModal;
    
    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
