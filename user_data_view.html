<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Records</title>

  <!-- Ethers.js -->
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
    :root {
      --primary: #273c75;
      --secondary: #40739e;
      --background: #f4f6fb;
      --card: #ffffff;
      --text: #2f3640;
      --success: #43a047;
      --danger: #c23616;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: var(--background);
      color: var(--text);
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      background: var(--card);
      padding: 30px;
      border-radius: 15px;
      box-shadow: var(--shadow);
    }

    /* Header */
    h1 {
      color: var(--primary);
      border-bottom: 2px solid #e0e6eb;
      padding-bottom: 10px;
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 26px;
    }

    /* Buttons */
    .btn-primary {
      padding: 10px 18px;
      background: var(--secondary);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: #5d8aa8;
    }

    /* Status Message */
    .status-message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }

    .status-loading { background: #e3f2fd; color: var(--secondary); }
    .status-success { background: #e8f5e9; color: var(--success); }
    .status-error   { background: #ffebee; color: var(--danger); }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 15px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .data-table th {
      background: var(--primary);
      color: white;
      padding: 12px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .data-table td {
      padding: 12px;
      border-bottom: 1px solid #e3e3e3;
    }

    .data-table tr:nth-child(even) { background: #f8f9fa; }
    .data-table tr:hover { background: #eef2f7; }

    /* Info Text */
    .info-text {
      font-size: 12px;
      color: #7f8fa6;
      margin-top: -10px;
      margin-bottom: 15px;
    }

    .info-text a {
      color: var(--secondary);
      font-weight: 600;
      text-decoration: none;
    }

  </style>
</head>
<body>

<div class="container">

  <button class="btn-primary" onclick="window.location.href='secure.html'">← Back</button>
  
  <h1>
    🧑‍🎓 Student Records (Read Only)
  </h1>

  <p class="info-text">
    Data source: <span id="dataSourceText">Loading...</span><br>
    Access controlled by <code style="color: var(--primary);">AuthManager.sol</code>
  </p>

  <!-- ACCESS MESSAGE -->
  <div id="statusBox" class="status-message status-loading">
    Checking wallet & user role...
  </div>

  <!-- DATA CONTENT -->
  <div id="dataSection" style="display:none;">
    <p>
      Role: <strong id="userRoleText">...</strong> |
      Wallet: <strong id="walletText">...</strong>
    </p>

    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Address</th>
          <th>Course</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
/* -------------------------------------------------
   CONFIGURATION
-------------------------------------------------- */

const CONTRACT_ADDRESS = "0xd1968a1b2250233500D4dd3967012928e87Ef66c";
const AUTH_ABI = ["function getRole(address user) view returns (string memory)"];
const ALLOWED_ROLES = ["admin", "teacher"];

const JSON_URL = "https://gist.githubusercontent.com/google-gemini/c6b3e7f226a2731804b4c102a0a2f1c8/raw/student_data.json";

/* -------------------------------------------------
   DOM HELPERS
-------------------------------------------------- */

function setStatus(message, type = "loading") {
  const el = document.getElementById("statusBox");
  el.textContent = message;
  el.className = `status-message status-${type}`;
}

function shorten(addr) {
  return addr ? addr.slice(0,6) + "..." + addr.slice(-4) : "";
}

/* -------------------------------------------------
   ROLE & WALLET CHECK
-------------------------------------------------- */

async function checkAccess() {
  if (!window.ethereum) {
    return setStatus("MetaMask not detected.", "error");
  }

  setStatus("Connecting to wallet...", "loading");

  try {
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    const signer = provider.getSigner();
    const wallet = await signer.getAddress();

    document.getElementById("walletText").textContent = shorten(wallet);

    const contract = new ethers.Contract(CONTRACT_ADDRESS, AUTH_ABI, provider);
    const role = (await contract.getRole(wallet)).toLowerCase();

    document.getElementById("userRoleText").textContent = role || "member";
    document.getElementById("dataSourceText").innerHTML = `<a href="${JSON_URL}" target="_blank">GitHub JSON</a>`;

    // Access allowed
    if (ALLOWED_ROLES.includes(role)) {
      setStatus(`Access granted (${role.toUpperCase()})`, "success");
      document.getElementById("dataSection").style.display = "block";
      loadStudentData();
    } 
    // Access denied
    else {
      setStatus(`Access denied. Your role: ${role}`, "error");
      document.getElementById("dataSection").style.display = "none";
    }

  } catch (err) {
    console.error(err);
    setStatus("Failed to connect or fetch role: " + err.message, "error");
  }
}

/* -------------------------------------------------
   FETCH STUDENT DATA
-------------------------------------------------- */

async function loadStudentData() {
  const body = document.getElementById("tableBody");
  body.innerHTML = `<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>`;

  try {
    const res = await fetch(JSON_URL);
    if (!res.ok) throw new Error("Network error: " + res.status);

    const data = await res.json();
    renderTable(data);

  } catch (err) {
    console.error(err);
    body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--danger);">Error loading data.</td></tr>`;
  }
}

/* -------------------------------------------------
   RENDER TABLE
-------------------------------------------------- */

function renderTable(records) {
  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  if (!Array.isArray(records) || records.length === 0) {
    return body.innerHTML = `<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>`;
  }

  records.forEach(r => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${r.name || "N/A"}</td>
      <td>${r.age || "N/A"}</td>
      <td>${r.address || "N/A"}</td>
      <td>${r.course || "N/A"}</td>
      <td>${r.status || "N/A"}</td>
    `;
    body.appendChild(row);
  });
}

/* -------------------------------------------------
   STARTUP
-------------------------------------------------- */

window.addEventListener("DOMContentLoaded", checkAccess);

if (window.ethereum) {
  ethereum.on("accountsChanged", () => location.reload());
  ethereum.on("chainChanged", () => location.reload());
}
</script>

</body>
</html>
