<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Records (Admin/Teacher)</title>
  
  <!-- Ethers for Role Check -->
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  
  <style>
    :root {
      --primary-color: #273c75;
      --secondary-color: #40739e;
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --success-color: #43a047;
      --danger-color: #c23616;
      --warning-color: #ffb300;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 15px;
      padding: 30px;
      box-shadow: var(--shadow);
    }
    h1 {
      color: var(--primary-color);
      border-bottom: 2px solid #e0e6eb;
      padding-bottom: 10px;
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
      text-align: center;
    }
    .status-denied { background-color: #ffebee; color: var(--danger-color); border: 1px solid #ffcdd2; }
    .status-loading { background-color: #e3f2fd; color: var(--secondary-color); }
    .status-success { background-color: #e8f5e9; color: var(--success-color); }
    
    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .data-table th, .data-table td {
      padding: 12px 15px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #dfe4ea;
    }
    .data-table th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .data-table tr:nth-child(even) { background-color: #f8f9fa; }
    .data-table tr:hover { background-color: #eef2f7; }

    .btn-back {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
      background-color: var(--secondary-color);
      color: white;
      margin-right: 15px;
      margin-bottom: 20px;
    }
    .btn-back:hover { background-color: #5d8aa8; }
    
    .data-source-info {
        font-size: 12px;
        color: #7f8fa6;
        margin-top: -10px;
        margin-bottom: 20px;
    }
    .data-source-info a {
        color: var(--secondary-color);
        text-decoration: none;
        font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    
    <h1>
      <span>🧑‍🎓 Student Records (Read-Only)</span>
    </h1>
    
    <p class="data-source-info">
        Data source: <span id="dataSourceLink">Loading source...</span>. Access is controlled by <code style="color:var(--primary-color);">AuthManager.sol</code> role check.
    </p>

    <div id="accessStatus" class="status-message status-loading">
        Initializing and checking user role...
    </div>

    <div id="dataContent" style="display: none;">
        <p>Your Role: <strong id="userRole">...</strong> | Wallet: <strong id="walletAddress">...</strong></p>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Address</th>
                    <th>Enrolled Course</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr><td colspan="5" style="text-align: center;">Fetching student records from GitHub...</td></tr>
            </tbody>
        </table>
    </div>
  </div>

  <script>
    // --- BLOCKCHAIN CONFIG (from AuthManager.sol) ---
    // NOTE: Replace with your actual AuthManager contract address
    const CONTRACT_ADDRESS = "0xd1968a1b2250233500D4dd3967012928e87Ef66c"; 
    const AUTH_ABI = [ "function getRole(address user) view returns (string memory)" ];
    const ALLOWED_ROLES = ["admin", "teacher"];

    // --- DATA CONFIG (Public GitHub JSON) ---
    // This is a publicly accessible URL pointing to a raw JSON file on GitHub.
    const GITHUB_JSON_URL = "users.json";
    
    let currentAccount, userRole;

    // --- UTILITY FUNCTIONS ---
    function setStatus(message, isSuccess = true, isLoading = false) {
        const statusEl = document.getElementById('accessStatus');
        statusEl.textContent = message;
        statusEl.className = 'status-message ' + (
            isLoading ? 'status-loading' : 
            isSuccess ? 'status-success' : 
            'status-denied'
        );
    }

    function shortAddr(a) {
        return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "N/A";
    }

    // --- CORE LOGIC ---

    // 1. Connect Wallet and Check Role
    async function initWalletAndCheckRole() {
        if (typeof window.ethereum === "undefined") {
            setStatus("MetaMask not found. Cannot verify role.", false);
            return;
        }

        try {
            setStatus("Connecting wallet and checking role...", true, true);
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            currentAccount = await provider.getSigner().getAddress();
            document.getElementById('walletAddress').textContent = shortAddr(currentAccount);
            document.getElementById('dataSourceLink').innerHTML = `<a href="${GITHUB_JSON_URL}" target="_blank">Static GitHub JSON</a>`;

            const contract = new ethers.Contract(CONTRACT_ADDRESS, AUTH_ABI, provider);
            
            // Call the blockchain to get the current user's role
            userRole = (await contract.getRole(currentAccount)).toLowerCase();
            document.getElementById('userRole').textContent = userRole || 'member (default)';

            if (ALLOWED_ROLES.includes(userRole)) {
                // Access Granted
                setStatus(`Access Granted! Role: ${userRole.toUpperCase()}`, true);
                document.getElementById('dataContent').style.display = 'block';
                // 2. Fetch and render data
                await fetchStudentRecords();
            } else {
                // Access Denied
                setStatus(`Access Denied. Your role (${userRole || 'member'}) does not permit viewing this data.`, false);
                document.getElementById('dataContent').style.display = 'none';
            }

        } catch (error) {
            console.error("Connection/Role check error:", error);
            setStatus(`Connection/Contract Error: ${error.message || 'Check console. Ensure AuthManager is deployed.'}`, false);
        }
    }

    // 2. Fetch Data from GitHub
    async function fetchStudentRecords() {
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Fetching records...</td></tr>`;

        try {
            const response = await fetch(GITHUB_JSON_URL);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const records = await response.json();
            
            if (!Array.isArray(records)) {
                throw new Error("Data retrieved is not a list/array.");
            }

            renderTable(records);

        } catch (error) {
            console.error("GitHub Fetch failed:", error);
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger-color);">Error fetching data: ${error.message}. Check GitHub URL.</td></tr>`;
        }
    }

    // 3. Render Data to UI
    function renderTable(records) {
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = ''; 

        if (records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--secondary-color);">No student records found in the GitHub file.</td></tr>`;
            return;
        }

        records.forEach(record => {
            const row = tbody.insertRow();
            row.insertCell().textContent = record.name || 'N/A';
            row.insertCell().textContent = record.age || 'N/A';
            row.insertCell().textContent = record.address || 'N/A';
            row.insertCell().textContent = record.course || 'N/A';
            row.insertCell().textContent = record.status || 'N/A';
        });
    }

    // --- STARTUP ---
    window.addEventListener("DOMContentLoaded", initWalletAndCheckRole);
    
    // Add event listeners for MetaMask account/network changes
    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
