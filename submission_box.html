<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submission Portal</title>
  
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script> <style>
    :root {
      --primary-color: #273c75;
      --secondary-color: #40739e;
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --success-color: #43a047;
      --danger-color: #c23616;
      --warning-color: #ffb300;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 15px;
      padding: 30px;
      box-shadow: var(--shadow);
    }
    h1 {
      color: var(--primary-color);
      border-bottom: 2px solid #e0e6eb;
      padding-bottom: 10px;
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-back, .btn-primary {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn-back {
      background-color: var(--secondary-color);
      color: white;
      margin-right: 15px;
      margin-bottom: 20px;
    }
    .btn-back:hover { background-color: #5d8aa8; }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--secondary-color);
    }

    /* Status Messages and Access Info */
    #accessStatus {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
      text-align: center;
    }
    .status-denied { background-color: #ffebee; color: var(--danger-color); border: 1px solid #ffcdd2; }
    .status-loading { background-color: #e3f2fd; color: var(--secondary-color); }
    .status-success { background-color: #e8f5e9; color: var(--success-color); }
    
    #accessInfo {
        margin-bottom: 20px;
        padding: 10px;
        background-color: var(--bg-color);
        border-radius: 8px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
    }
    #accessInfo strong { color: var(--primary-color); }

    /* Submission Box UI */
    #submission-box-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }
    .submission-box-item {
        background: #fdfdfd;
        border: 1px solid #e0e6eb;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
    }
    .submission-box-item h3 {
        margin-top: 0;
        color: var(--primary-color);
    }
    .submission-box-item p {
        flex-grow: 1;
        font-size: 14px;
        color: var(--text-color);
    }
    .box-footer {
        margin-top: 15px;
        padding-top: 10px;
        border-top: 1px dashed #e0e6eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-light);
    }
    .box-footer button {
        padding: 6px 10px;
        font-size: 12px;
    }

    /* Modal Styling (For both Create Box and Submission) */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none; /* Hidden by default */
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 15px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .modal-content input[type="text"], 
    .modal-content input[type="file"],
    .modal-content textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }
    #submissionStatus {
        margin-top: 10px;
        font-size: 13px;
        font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    
    <h1>
      <span>📂 Submission Portal (Firebase)</span>
      <button id="createBoxBtn" class="btn-primary" style="display: none;" onclick="openCreateModal()">
        + Create Submission Box
      </button>
    </h1>
    
    <div id="accessStatus" class="status-message status-loading">
        Initializing and checking user role...
    </div>
    
    <div id="accessInfo" style="display: none;">
        <span>Wallet: <strong id="walletAddress">...</strong></span>
        <span>Your Role: <strong id="userRole">...</strong></span>
    </div>

    <div id="submission-box-list">
        <p style="grid-column: 1 / -1; text-align: center; color: var(--text-light);" id="loadingMessage">
            Loading submission boxes...
        </p>
    </div>
  </div>

  <div id="createBoxModal" class="modal">
    <div class="modal-content">
        <h2>Create New Submission Box</h2>
        <input type="text" id="boxTitle" placeholder="Submission Title (e.g., Assignment 1: Report)" required>
        <textarea id="boxDescription" placeholder="Detailed instructions..." rows="4"></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button class="btn-back" onclick="closeCreateModal()">Cancel</button>
            <button class="btn-primary" onclick="createSubmissionBox()">Create Box</button>
        </div>
    </div>
  </div>
  
  <div id="submissionModal" class="modal">
    <div class="modal-content">
        <h2 id="submissionModalTitle">Submit File</h2>
        <p>Submission for: <strong id="submissionAssignmentTitle"></strong></p>
        
        <label for="fileInput" style="display: block; margin-bottom: 5px;">Select File:</label>
        <input type="file" id="fileInput" />
        
        <input type="text" id="submissionNote" placeholder="Optional: Add a note for the teacher" />

        <div id="submissionStatus" class="status-message" style="display:none;"></div>
        
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button class="btn-back" onclick="closeSubmissionModal()">Cancel</button>
            <button class="btn-primary" id="uploadBtn" onclick="handleFileUpload()">Upload & Submit</button>
        </div>
    </div>
  </div>

  <script>
    // --- BLOCKCHAIN CONFIG (from AuthManager.sol) ---
    const CONTRACT_ADDRESS = "0xd1968a1b2250233500D4dd3967012928e87Ef66c"; 
    const AUTH_ABI = [ "function getRole(address user) view returns (string memory)" ];
    const ALLOWED_ROLES = ["admin", "teacher"];

    // --- ⚠️ FIREBASE CONFIG (REPLACE THESE!) ⚠️ ---
    // You MUST replace these values with your actual Firebase project configuration.
    const firebaseConfig = {
        apiKey: "AIzaSyDIg9PBnO2azEIdx51RUhfHBclt2lYxHwU",
        authDomain: "student-portal-1f1ee.firebaseapp.com",
        projectId: "student-portal-1f1ee",
        storageBucket: "student-portal-1f1ee.firebasestorage.app", // Changed to use .appspot.com for Storage
        messagingSenderId: "256625411080",
        appId: "1:256625411080:web:f8fc44201604e769effdbd",
        measurementId: "G-XCZ2Q2841X"
    };

    let db, auth, storage; // Firebase instances
    let currentAccount, userRole;
    let currentSubmissionBoxId; // State variable for the active submission box

    // --- UTILITY FUNCTIONS ---
    function setStatus(message, isSuccess = true, isLoading = false) {
        const statusEl = document.getElementById('accessStatus');
        statusEl.textContent = message;
        statusEl.className = 'status-message ' + (
            isLoading ? 'status-loading' : 
            isSuccess ? 'status-success' : 
            'status-denied'
        );
    }
    
    function setSubmissionStatus(message, isSuccess = true) {
        const statusEl = document.getElementById('submissionStatus');
        statusEl.style.display = 'block';
        statusEl.textContent = message;
        statusEl.className = 'status-message ' + (isSuccess ? 'status-success' : 'status-denied');
    }

    function shortAddr(a) {
        return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "N/A";
    }

    // Modal Handlers
    function openCreateModal() {
        document.getElementById('createBoxModal').style.display = 'flex';
        document.getElementById('boxTitle').focus();
    }

    function closeCreateModal() {
        document.getElementById('createBoxModal').style.display = 'none';
        document.getElementById('boxTitle').value = '';
        document.getElementById('boxDescription').value = '';
    }

    function closeSubmissionModal() {
        document.getElementById('submissionModal').style.display = 'none';
        document.getElementById('fileInput').value = ''; // Clear file selection
        document.getElementById('submissionNote').value = '';
        document.getElementById('submissionStatus').style.display = 'none';
        currentSubmissionBoxId = null;
    }

    // --- CORE LOGIC ---

    async function init() {
        if (typeof window.ethereum === "undefined") {
            setStatus("MetaMask not found. Cannot verify role.", false);
            return;
        }
        
        // 1.1 Firebase Initialization
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth(); 
            storage = firebase.storage(); // Initialize Storage
            
            await auth.signInAnonymously();
            
        } catch (e) {
            console.error("Firebase Initialization Failed:", e);
            setStatus(`Firebase initialization failed: ${e.message}`, false);
            return;
        }

        // 1.2 Wallet and Role Check (Blockchain)
        try {
            setStatus("Connecting wallet and checking role...", true, true);
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            currentAccount = await provider.getSigner().getAddress();
            
            const contract = new ethers.Contract(CONTRACT_ADDRESS, AUTH_ABI, provider);
            
            userRole = (await contract.getRole(currentAccount)).toLowerCase();
            document.getElementById('userRole').textContent = userRole || 'member (default)';
            document.getElementById('walletAddress').textContent = shortAddr(currentAccount);
            document.getElementById('accessInfo').style.display = 'flex';

            if (ALLOWED_ROLES.includes(userRole)) {
                setStatus(`Access Granted! Role: ${userRole.toUpperCase()}. You can create submission boxes.`, true);
                document.getElementById('createBoxBtn').style.display = 'inline-block';
            } else {
                setStatus(`Access Granted (Read-Only). Your role (${userRole || 'member'}) does not permit creating boxes.`, true);
            }
            
            loadSubmissionBoxes();

        } catch (error) {
            console.error("Connection/Role check error:", error);
            setStatus(`Connection/Contract Error: ${error.message || 'Check console. Ensure AuthManager is deployed.'}`, false);
        }
    }

    // CRUD: Create Submission Box (No change from previous step)
    async function createSubmissionBox() {
        if (!ALLOWED_ROLES.includes(userRole)) {
            alert("Permission denied. Only Admins and Teachers can create submission boxes.");
            return;
        }

        const title = document.getElementById('boxTitle').value.trim();
        const description = document.getElementById('boxDescription').value.trim();

        if (!title) {
            alert("The submission title cannot be empty.");
            return;
        }
        
        try {
            const newBox = {
                title: title,
                description: description,
                creator: currentAccount,
                creatorRole: userRole,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection("submissionBoxes").add(newBox);
            closeCreateModal();
        } catch (error) {
            console.error("Error creating submission box:", error);
            alert(`Failed to create submission box. Check console. Error: ${error.message}`);
        }
    }
    
    // UI: Open Submission Modal
    async function openSubmission(boxId) {
        currentSubmissionBoxId = boxId;
        
        // Fetch the box title for display
        try {
            const doc = await db.collection("submissionBoxes").doc(boxId).get();
            if (doc.exists) {
                document.getElementById('submissionAssignmentTitle').textContent = doc.data().title;
            } else {
                document.getElementById('submissionAssignmentTitle').textContent = "Assignment Not Found";
            }
        } catch (error) {
            console.error("Error fetching assignment title:", error);
            document.getElementById('submissionAssignmentTitle').textContent = "Error Loading Title";
        }
        
        document.getElementById('submissionModal').style.display = 'flex';
        document.getElementById('fileInput').focus();
    }

    // CRUD: Handle File Upload to Storage and Metadata to Firestore
    async function handleFileUpload() {
        if (!currentAccount) {
            setSubmissionStatus("Wallet not connected.", false);
            return;
        }

        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const note = document.getElementById('submissionNote').value.trim();
        const uploadBtn = document.getElementById('uploadBtn');

        if (!file) {
            setSubmissionStatus("Please select a file to upload.", false);
            return;
        }
        
        uploadBtn.disabled = true;
        setSubmissionStatus(`Uploading ${file.name}...`, true);

        try {
            // 1. Prepare Storage path: submissions/{boxId}/{user_address}_{timestamp}_{filename}
            const filename = file.name;
            const timestamp = Date.now();
            const storagePath = `submissions/${currentSubmissionBoxId}/${currentAccount}_${timestamp}_${filename}`;
            
            const storageRef = storage.ref(storagePath);
            const uploadTask = storageRef.put(file);

            // 2. Monitor upload progress (Optional, but good UX)
            uploadTask.on(firebase.storage.TaskEvent.STATE_CHANGED, 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    setSubmissionStatus(`Upload is ${Math.round(progress)}% complete...`, true);
                }, 
                (error) => {
                    throw new Error(`Storage Upload Failed: ${error.message}`);
                }, 
                async () => {
                    // 3. Get download URL and save metadata to Firestore
                    const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                    
                    const submissionData = {
                        boxId: currentSubmissionBoxId,
                        submitter: currentAccount,
                        submitterRole: userRole || 'member',
                        submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        fileName: filename,
                        fileSize: file.size,
                        filePath: storagePath,
                        fileURL: downloadURL,
                        note: note
                    };
                    
                    // Save metadata to a new collection: 'submissions'
                    await db.collection('submissions').add(submissionData);

                    setSubmissionStatus("✅ File submitted successfully!", true);
                    
                    // Close modal after a short delay
                    setTimeout(closeSubmissionModal, 2000);
                }
            );

        } catch (error) {
            console.error("Submission Failed:", error);
            setSubmissionStatus(`Submission Failed: ${error.message}`, false);
        } finally {
            uploadBtn.disabled = false;
        }
    }


    // CRUD: Read Submission Boxes (Real-time Listener - No change)
    function loadSubmissionBoxes() {
        const listEl = document.getElementById('submission-box-list');
        const loadingMsg = document.getElementById('loadingMessage');
        
        if (loadingMsg) loadingMsg.textContent = "Loading submission boxes from Firebase...";
        listEl.innerHTML = ''; 

        db.collection("submissionBoxes")
          .orderBy("createdAt", "desc")
          .onSnapshot((querySnapshot) => {
            listEl.innerHTML = ''; 
            
            if (querySnapshot.empty) {
                listEl.innerHTML = `
                    <p style="grid-column: 1 / -1; text-align: center; color: var(--text-light);">
                        No submission boxes found.
                    </p>`;
                return;
            }

            querySnapshot.forEach((doc) => {
                const box = doc.data();
                const boxId = doc.id;
                appendBoxToUI(box, boxId);
            });
          }, (error) => {
            console.error("Error loading submission boxes:", error);
            listEl.innerHTML = `
                <p style="grid-column: 1 / -1; text-align: center; color: var(--danger-color);">
                    Error: Could not load data from Firebase. Check console/network.
                </p>`;
          });
    }

    // UI: Render Box Item (Uses new openSubmission function)
    function appendBoxToUI(box, id) {
        const listEl = document.getElementById('submission-box-list');
        const boxDate = box.createdAt ? box.createdAt.toDate().toLocaleDateString() : 'Saving...';
        
        const el = document.createElement("div");
        el.className = "submission-box-item";
        el.innerHTML = `
            <h3>${box.title}</h3>
            <p>${box.description || 'No description provided.'}</p>
            <div class="box-footer">
                <span>Created by: ${shortAddr(box.creator)} (${box.creatorRole}) on ${boxDate}</span>
                <button class="btn-primary" onclick="openSubmission('${id}')">View/Submit</button>
            </div>
        `;
        listEl.appendChild(el);
    }
    
    // --- STARTUP & METAMASK LISTENERS ---
    window.addEventListener("DOMContentLoaded", init);
    
    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
