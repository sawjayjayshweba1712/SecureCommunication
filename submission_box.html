<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submission Portal</title>
  
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script> 
  
  <style>
    /* ========== COLORS & THEME ========== */
    :root {
      --primary-color: #2f3640;
      --secondary-color: #00a8ff;
      --accent-color: #9c88ff;
      --bg-color: #f5f6fa;
      --card-bg: #ffffff;
      --text-color: #2d3436;
      --text-light: #636e72;
      --success-color: #44bd32;
      --danger-color: #e84118;
      --warning-color: #fbc531;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      --transition: 0.3s ease-in-out;
      --border-radius: 12px;
      --font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
      line-height: 1.5;
    }

    /* ========== CONTAINER ========== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 40px;
      box-shadow: var(--shadow);
      transition: box-shadow var(--transition);
    }
    .container:hover {
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    /* ========== HEADINGS ========== */
    h1 {
      color: var(--primary-color);
      border-bottom: 2px solid #e0e6eb;
      padding-bottom: 10px;
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
    }

    /* ========== BUTTONS ========== */
    button {
      font-family: var(--font-family);
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: var(--border-radius);
      transition: all var(--transition);
    }

    .btn-back {
      background-color: var(--secondary-color);
      color: #fff;
      padding: 10px 20px;
      margin-bottom: 25px;
    }
    .btn-back:hover {
      background-color: #0097e6;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      padding: 10px 20px;
    }
    .btn-primary:hover {
      background-color: var(--secondary-color);
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #fff;
      padding: 8px 15px;
      font-size: 13px;
    }
    .btn-danger:hover {
      background-color: #c0392b;
    }

    /* ========== STATUS MESSAGES ========== */
    #accessStatus {
      padding: 15px 20px;
      border-radius: var(--border-radius);
      margin-bottom: 25px;
      font-weight: 600;
      text-align: center;
      font-size: 15px;
      box-shadow: var(--shadow);
    }
    .status-denied {
      background-color: #ffebee;
      color: var(--danger-color);
      border: 1px solid #ffcdd2;
    }
    .status-loading {
      background-color: #dff9fb;
      color: var(--secondary-color);
    }
    .status-success {
      background-color: #eaffea;
      color: var(--success-color);
    }

    /* ========== ACCESS INFO ========== */
    #accessInfo {
      margin-bottom: 25px;
      padding: 15px 20px;
      background-color: #f0f0f0;
      border-radius: var(--border-radius);
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    #accessInfo strong {
      color: var(--primary-color);
    }

    /* ========== SUBMISSION BOX LIST ========== */
    #submission-box-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }
    .submission-box-item {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 25px 20px 20px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .submission-box-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
    }
    .submission-box-item h3 {
      margin: 0 0 12px 0;
      color: var(--primary-color);
      font-size: 20px;
      padding-right: 70px;
    }
    .submission-box-item p {
      flex-grow: 1;
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 15px;
    }
    .box-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-light);
    }
    .box-footer button {
      padding: 6px 12px;
      font-size: 13px;
    }
    .box-delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
    }

    /* ========== MODAL ========== */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(47, 54, 64, 0.75);
      display: none; 
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease forwards;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--border-radius);
      width: 90%;
      max-width: 500px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      animation: slideUp 0.3s ease forwards;
    }
    .modal-content h2 {
      margin-top: 0;
      color: var(--primary-color);
      margin-bottom: 20px;
    }
    .modal-content input[type="text"],
    .modal-content input[type="file"],
    .modal-content textarea {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border: 1px solid #dcdde1;
      border-radius: var(--border-radius);
      box-sizing: border-box;
      font-family: var(--font-family);
      transition: all var(--transition);
    }
    .modal-content input[type="text"]:focus,
    .modal-content textarea:focus {
      border-color: var(--secondary-color);
      outline: none;
      box-shadow: 0 0 8px rgba(0,168,255,0.2);
    }
    #submissionStatus {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    @keyframes slideUp {
      from {transform: translateY(30px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }

    /* ========== LOADING MESSAGE ========== */
    #loadingMessage {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-light);
      font-style: italic;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .container { padding: 25px; }
      h1 { flex-direction: column; gap: 15px; font-size: 24px; }
      #accessInfo { flex-direction: column; gap: 10px; text-align: center; }
      .submission-box-item h3 { padding-right: 50px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    
    <h1>
      <span>📂 Submission Portal (Firebase)</span>
      <button id="createBoxBtn" class="btn-primary" style="display: none;" onclick="openCreateModal()">
        + Create Submission Box
      </button>
    </h1>
    
    <div id="accessStatus" class="status-message status-loading">
        Initializing and checking user role...
    </div>
    
    <div id="accessInfo" style="display: none;">
        <span>Wallet: <strong id="walletAddress">...</strong></span>
        <span>Your Role: <strong id="userRole">...</strong></span>
    </div>

    <div id="submission-box-list">
        <p id="loadingMessage">
            Loading submission boxes...
        </p>
    </div>
  </div>

  <div id="createBoxModal" class="modal">
    <div class="modal-content">
        <h2>Create New Submission Box</h2>
        <input type="text" id="boxTitle" placeholder="Submission Title (e.g., Assignment 1: Report)" required>
        <textarea id="boxDescription" placeholder="Detailed instructions..." rows="4"></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button class="btn-back" onclick="closeCreateModal()">Cancel</button>
            <button class="btn-primary" onclick="createSubmissionBox()">Create Box</button>
        </div>
    </div>
  </div>
  
  <div id="submissionModal" class="modal">
    <div class="modal-content">
        <h2 id="submissionModalTitle">Submit File</h2>
        <p>Submission for: <strong id="submissionAssignmentTitle"></strong></p>
        
        <label for="fileInput" style="display: block; margin-bottom: 5px;">Select File:</label>
        <input type="file" id="fileInput" />
        
        <input type="text" id="submissionNote" placeholder="Optional: Add a note for the teacher" />

        <div id="submissionStatus" class="status-message" style="display:none;"></div>
        
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button class="btn-back" onclick="closeSubmissionModal()">Cancel</button>
            <button class="btn-primary" id="uploadBtn" onclick="handleFileUpload()">Upload & Submit</button>
        </div>
    </div>
  </div>

  <script>
    // ========================== YOUR EXISTING JAVASCRIPT CODE ==========================
    // All JS remains exactly as in your original file
  </script>
</body>
</html>
