<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Submission Portal</title>
    
    <!-- Ethers for Role Check -->
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, addDoc, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // Global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (Object.keys(firebaseConfig).length > 0) {
            setLogLevel('Debug'); // Enable logging for debugging
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);
            window.storage = getStorage(app);
            window.appId = appId;
            
            // Wait for authentication before proceeding
            async function authenticateFirebase() {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(window.auth, initialAuthToken);
                        console.log("Firebase signed in with custom token.");
                    } else {
                        await signInAnonymously(window.auth);
                        console.log("Firebase signed in anonymously.");
                    }
                } catch(error) {
                    console.error("Firebase authentication failed:", error);
                    alert("Firebase authentication failed. Check console for details.");
                }
            }
            authenticateFirebase();
        } else {
            console.error("Firebase config is missing.");
        }
        
        // Expose Firebase objects globally for the main script block
        window.getFirestore = getFirestore;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.addDoc = addDoc;
        window.doc = doc;
        window.serverTimestamp = serverTimestamp;
        window.getStorage = getStorage;
        window.ref = ref;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;
    </script>

    <style>
        :root {
            --primary-color: #273c75;
            --secondary-color: #40739e;
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-color: #2f3640;
            --success-color: #43a047;
            --danger-color: #c23616;
            --warning-color: #ffb300;
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--shadow);
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid #e0e6eb;
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        .status-denied { background-color: #ffebee; color: var(--danger-color); border: 1px solid #ffcdd2; }
        .status-loading { background-color: #e3f2fd; color: var(--secondary-color); }
        .status-success { background-color: #e8f5e9; color: var(--success-color); }
        
        /* Buttons */
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            margin-right: 5px;
        }
        .btn-back {
            background-color: var(--secondary-color);
            color: white;
            margin-bottom: 20px;
        }
        .btn-back:hover { background-color: #5d8aa8; }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success {
            background-color: var(--success-color);
            color: white;
        }
        .btn-success:hover { background-color: #388e3c; }

        /* Forms and Inputs */
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        /* Submission Box List */
        #submissionBoxes, #studentSubmissions {
            margin-top: 20px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }
        .box-card {
            background: #f8f9fa;
            border: 1px solid #e0e6eb;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .box-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .box-card h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.2rem;
        }
        .box-card p {
            font-size: 0.9em;
            color: var(--text-light);
        }
        .submission-item {
            border: 1px solid #dfe4ea;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .submission-item:nth-child(even) { background-color: #fcfcfc; }

    </style>
</head>
<body>

    <div class="container">
        <button class="btn btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
        
        <h1>
            <span>📁 Course Submission Portal</span>
        </h1>
        
        <div id="accessStatus" class="status-message status-loading">
            Initializing and checking user role...
        </div>

        <div id="mainContent" style="display: none;">
            <p>Your Role: <strong id="userRole">...</strong> | Wallet: <strong id="walletAddress">...</strong> | User ID: <strong id="userId">...</strong></p>

            <!-- TEACHER/ADMIN ONLY PANEL -->
            <div id="adminControls" style="display: none;">
                <h2 style="color: var(--warning-color); border-bottom-color: var(--warning-color);">Teacher/Admin Panel</h2>
                
                <div class="box-card" id="createBoxFormContainer" style="cursor: default; border-left-color: var(--success-color);">
                    <h3>➕ Create New Submission Box</h3>
                    <div class="form-group">
                        <input type="text" id="boxTitle" placeholder="Assignment Title (e.g., Final Project Report)" required>
                    </div>
                    <div class="form-group">
                        <textarea id="boxDescription" placeholder="Description and requirements..." required></textarea>
                    </div>
                    <div class="form-group">
                        <input type="text" id="boxDueDate" placeholder="Due Date (e.g., 2025-12-31)" required>
                    </div>
                    <button class="btn btn-success" onclick="createSubmissionBox()">Create Box</button>
                    <span id="createStatus" style="margin-left: 10px;"></span>
                </div>
            </div>

            <!-- SUBMISSION BOX LIST -->
            <h2>Available Submission Boxes</h2>
            <div id="submissionBoxes">
                <p style="grid-column: 1 / -1; color: var(--text-light);">No submission boxes found.</p>
            </div>
            
            <!-- MODAL/DETAIL VIEW FOR STUDENTS/TEACHERS -->
            <div id="boxDetailView" style="display: none; margin-top: 40px;">
                <button class="btn btn-back" onclick="showBoxList()">← Back to Boxes</button>
                <h2 id="detailTitle"></h2>
                <p>Due: <strong id="detailDueDate"></strong></p>
                <p id="detailDescription"></p>

                <!-- STUDENT UPLOAD SECTION -->
                <div id="studentUploadSection" style="display: none; border: 1px dashed var(--secondary-color); padding: 20px; border-radius: 8px; margin-top: 20px;">
                    <h3>📤 Submit Your File</h3>
                    <div id="existingSubmission" style="margin-bottom: 15px; color: var(--success-color); font-weight: 600; display: none;">
                        ✅ Submitted! View your file: <a id="existingFileLink" target="_blank" style="color: var(--success-color);"></a>
                    </div>
                    <div id="uploadForm">
                        <div class="form-group">
                            <input type="file" id="submissionFile" required>
                        </div>
                        <button class="btn btn-primary" onclick="handleFileUpload()">Upload Submission</button>
                        <span id="uploadStatus" style="margin-left: 10px;"></span>
                    </div>
                </div>

                <!-- TEACHER/ADMIN SUBMISSIONS VIEW -->
                <div id="teacherSubmissionView" style="display: none; margin-top: 20px;">
                    <h3>📥 Student Submissions</h3>
                    <div id="studentSubmissions">
                        <!-- Submissions will be injected here -->
                    </div>
                    <p id="noSubmissions" style="text-align: center; color: var(--text-light); margin-top: 20px;"></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- BLOCKCHAIN CONFIG ---
        const CONTRACT_ADDRESS = "0xd1968a1b2250233500D4dd3967012928e87Ef66c"; 
        const AUTH_ABI = [ "function getRole(address user) view returns (string memory)" ];
        const TEACHER_ADMIN_ROLES = ["admin", "teacher"];

        // --- GLOBAL STATE ---
        let currentAccount = null; // Wallet address (from Ethers)
        let userId = null; // Firebase Auth UID
        let userRole = null;
        let currentBoxId = null;

        // --- UTILITY FUNCTIONS ---
        function setStatus(message, isSuccess = true, isLoading = false) {
            const statusEl = document.getElementById('accessStatus');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + (
                isLoading ? 'status-loading' : 
                isSuccess ? 'status-success' : 
                'status-denied'
            );
        }

        function shortAddr(a) {
            return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "N/A";
        }
        
        function getCollectionPath(name) {
             return `artifacts/${window.appId}/public/data/${name}`;
        }

        // --- CORE INITIALIZATION ---

        async function init() {
            if (typeof window.ethereum === "undefined") {
                setStatus("MetaMask not found. Cannot verify blockchain role.", false);
                return;
            }
            if (!window.auth || !window.db) {
                // Wait for Firebase to initialize after the module script runs
                setTimeout(init, 500);
                return;
            }

            // 1. Get Wallet Address
            try {
                setStatus("Connecting wallet and checking role...", true, true);
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                currentAccount = await provider.getSigner().getAddress();
            } catch (error) {
                setStatus(`Wallet Connection Error: ${error.message}`, false);
                return;
            }

            // 2. Get Firebase UID
            window.auth.onAuthStateChanged(async (user) => {
                if (user) {
                    userId = user.uid;
                    document.getElementById('walletAddress').textContent = shortAddr(currentAccount);
                    document.getElementById('userId').textContent = userId;
                    
                    // 3. Get Blockchain Role
                    await checkBlockchainRole();
                    
                    // 4. Start listening to submission boxes
                    listenToSubmissionBoxes();
                } else {
                    setStatus("Firebase authentication required.", false);
                }
            });
        }

        async function checkBlockchainRole() {
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, AUTH_ABI, provider);
                
                userRole = (await contract.getRole(currentAccount)).toLowerCase();
                document.getElementById('userRole').textContent = userRole || 'member (default)';

                document.getElementById('mainContent').style.display = 'block';
                setStatus(`Access OK. Role: ${userRole.toUpperCase()}`, true);

                if (TEACHER_ADMIN_ROLES.includes(userRole)) {
                    document.getElementById('adminControls').style.display = 'block';
                } else {
                    document.getElementById('adminControls').style.display = 'none';
                }

            } catch (error) {
                console.error("Blockchain Role Check Error:", error);
                setStatus(`Contract Error: ${error.message || 'Check AuthManager deployment/address.'}`, false);
            }
        }

        // --- FIREBASE LISTENERS (Firestore) ---

        function listenToSubmissionBoxes() {
            const boxesRef = collection(window.db, getCollectionPath('submissionBoxes'));
            const q = query(boxesRef);

            onSnapshot(q, (snapshot) => {
                const boxes = [];
                snapshot.forEach(doc => {
                    boxes.push({ id: doc.id, ...doc.data() });
                });
                renderSubmissionBoxes(boxes);
            }, (error) => {
                console.error("Error listening to submission boxes:", error);
                document.getElementById('submissionBoxes').innerHTML = 
                    `<p style="grid-column: 1 / -1; color: var(--danger-color);">Error loading boxes: ${error.message}</p>`;
            });
        }

        function renderSubmissionBoxes(boxes) {
            const container = document.getElementById('submissionBoxes');
            container.innerHTML = '';

            if (boxes.length === 0) {
                container.innerHTML = `<p style="grid-column: 1 / -1; color: var(--text-light);">No submission boxes have been created yet.</p>`;
                return;
            }

            boxes.forEach(box => {
                const boxElement = document.createElement('div');
                boxElement.className = 'box-card';
                boxElement.onclick = () => showBoxDetail(box.id, box);
                
                boxElement.innerHTML = `
                    <h3>${box.title}</h3>
                    <p>Due: ${box.dueDate}</p>
                    <p>Created by: ${shortAddr(box.createdBy)}</p>
                `;
                container.appendChild(boxElement);
            });
        }
        
        // --- TEACHER/ADMIN FUNCTIONALITY ---

        async function createSubmissionBox() {
            const title = document.getElementById('boxTitle').value.trim();
            const description = document.getElementById('boxDescription').value.trim();
            const dueDate = document.getElementById('boxDueDate').value.trim();
            const statusEl = document.getElementById('createStatus');
            
            if (!title || !description || !dueDate) {
                statusEl.textContent = "All fields are required.";
                statusEl.style.color = 'var(--danger-color)';
                return;
            }

            if (!currentAccount || !userId) {
                statusEl.textContent = "Authentication missing. Reload page.";
                statusEl.style.color = 'var(--danger-color)';
                return;
            }

            try {
                statusEl.textContent = "Creating box...";
                statusEl.style.color = 'var(--secondary-color)';

                const boxesRef = collection(window.db, getCollectionPath('submissionBoxes'));
                await addDoc(boxesRef, {
                    title: title,
                    description: description,
                    dueDate: dueDate,
                    createdBy: currentAccount,
                    creatorId: userId,
                    createdAt: serverTimestamp()
                });

                statusEl.textContent = "Box created successfully!";
                statusEl.style.color = 'var(--success-color)';
                
                // Clear form
                document.getElementById('boxTitle').value = '';
                document.getElementById('boxDescription').value = '';
                document.getElementById('boxDueDate').value = '';

                setTimeout(() => statusEl.textContent = '', 3000);
            } catch (error) {
                console.error("Error creating box:", error);
                statusEl.textContent = `Error: ${error.message}`;
                statusEl.style.color = 'var(--danger-color)';
            }
        }

        // --- DETAIL VIEW LOGIC ---

        function showBoxList() {
            currentBoxId = null;
            document.getElementById('boxDetailView').style.display = 'none';
            document.getElementById('submissionBoxes').style.display = 'grid';
            document.getElementById('adminControls').style.display = TEACHER_ADMIN_ROLES.includes(userRole) ? 'block' : 'none';
        }

        async function showBoxDetail(boxId, boxData) {
            currentBoxId = boxId;
            document.getElementById('submissionBoxes').style.display = 'none';
            document.getElementById('adminControls').style.display = 'none'; 
            document.getElementById('boxDetailView').style.display = 'block';

            document.getElementById('detailTitle').textContent = boxData.title;
            document.getElementById('detailDueDate').textContent = boxData.dueDate;
            document.getElementById('detailDescription').textContent = boxData.description;

            if (TEACHER_ADMIN_ROLES.includes(userRole)) {
                // TEACHER/ADMIN VIEW: Show all submissions
                document.getElementById('studentUploadSection').style.display = 'none';
                document.getElementById('teacherSubmissionView').style.display = 'block';
                listenToSubmissions(boxId);
            } else {
                // STUDENT VIEW: Show upload form
                document.getElementById('teacherSubmissionView').style.display = 'none';
                document.getElementById('studentUploadSection').style.display = 'block';
                checkExistingSubmission(boxId);
            }
        }

        // --- STUDENT UPLOAD FUNCTIONALITY ---

        async function checkExistingSubmission(boxId) {
            const submissionsRef = collection(window.db, getCollectionPath('submissions'));
            const q = query(submissionsRef);
            
            // Note: Since Firestore queries lack complexity (no 'AND' logic in a single call),
            // we listen to all and filter on the client, which is fine for small apps.
            // In a large production app, we would use dedicated collection paths/indexes.
            
            onSnapshot(q, (snapshot) => {
                let existing = null;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.boxId === boxId && data.studentUid === userId) {
                        existing = data;
                    }
                });

                const existingDiv = document.getElementById('existingSubmission');
                const uploadForm = document.getElementById('uploadForm');

                if (existing) {
                    existingDiv.style.display = 'block';
                    document.getElementById('existingFileLink').textContent = `File: ${existing.filename}`;
                    document.getElementById('existingFileLink').href = existing.downloadUrl;
                    uploadForm.style.display = 'none';
                } else {
                    existingDiv.style.display = 'none';
                    uploadForm.style.display = 'block';
                }
            });
        }

        async function handleFileUpload() {
            if (!currentBoxId || !userId || !currentAccount) return alert("System error: Box or user ID missing.");
            
            const fileInput = document.getElementById('submissionFile');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('uploadStatus');

            if (!file) {
                statusEl.textContent = "Please select a file to upload.";
                statusEl.style.color = 'var(--danger-color)';
                return;
            }

            statusEl.textContent = "Uploading file and recording submission...";
            statusEl.style.color = 'var(--secondary-color)';
            
            try {
                // 1. Upload file to Firebase Storage
                const storagePath = `submissions/${currentBoxId}/${userId}/${file.name}`;
                const storageRef = ref(window.storage, storagePath);
                
                // Use the MIME type from the file object
                const metadata = { contentType: file.type }; 
                const uploadResult = await uploadBytes(storageRef, file, metadata);
                
                // 2. Get the public download URL
                const downloadUrl = await getDownloadURL(uploadResult.ref);

                // 3. Record submission metadata in Firestore
                const submissionsRef = collection(window.db, getCollectionPath('submissions'));
                await addDoc(submissionsRef, {
                    boxId: currentBoxId,
                    studentId: currentAccount, // Wallet address (immutable ID)
                    studentUid: userId, // Firebase UID
                    filename: file.name,
                    storagePath: storagePath,
                    downloadUrl: downloadUrl,
                    timestamp: serverTimestamp()
                });

                statusEl.textContent = "Submission successful!";
                statusEl.style.color = 'var(--success-color)';
                fileInput.value = ''; // Clear file input
                
                // checkExistingSubmission will update the UI via onSnapshot
            } catch (error) {
                console.error("File upload/submission error:", error);
                statusEl.textContent = `Upload failed: ${error.message}`;
                statusEl.style.color = 'var(--danger-color)';
            }
        }


        // --- TEACHER/ADMIN SUBMISSIONS VIEW ---

        function listenToSubmissions(boxId) {
            const submissionsRef = collection(window.db, getCollectionPath('submissions'));
            const q = query(submissionsRef); 

            onSnapshot(q, async (snapshot) => {
                const submissions = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.boxId === boxId) {
                        submissions.push({ id: doc.id, ...data });
                    }
                });
                renderStudentSubmissions(submissions);
            }, (error) => {
                console.error("Error listening to submissions:", error);
                document.getElementById('studentSubmissions').innerHTML = 
                    `<p style="grid-column: 1 / -1; color: var(--danger-color);">Error loading submissions: ${error.message}</p>`;
            });
        }

        function renderStudentSubmissions(submissions) {
            const container = document.getElementById('studentSubmissions');
            container.innerHTML = '';
            document.getElementById('noSubmissions').style.display = 'none';

            if (submissions.length === 0) {
                document.getElementById('noSubmissions').textContent = "No student submissions for this box yet.";
                document.getElementById('noSubmissions').style.display = 'block';
                return;
            }

            submissions.forEach(sub => {
                const item = document.createElement('div');
                item.className = 'submission-item';
                
                const time = sub.timestamp ? sub.timestamp.toDate().toLocaleString() : 'Loading...';

                item.innerHTML = `
                    <div>
                        <strong>Student:</strong> ${shortAddr(sub.studentId)}<br>
                        <strong>File:</strong> <a href="${sub.downloadUrl}" target="_blank" style="color: var(--primary-color);">${sub.filename}</a>
                    </div>
                    <div>
                        <small style="color: var(--text-light);">Submitted: ${time}</small>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // --- STARTUP ---
        window.addEventListener("DOMContentLoaded", init);
        
        // Add event listeners for MetaMask account/network changes
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', () => window.location.reload());
            window.ethereum.on('chainChanged', () => window.location.reload());
        }
    </script>
</body>
</html>
