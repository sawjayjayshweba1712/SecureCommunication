<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blockchain Auth - Portal</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* 1. Global Reset and Font */
    :root {
      --primary-blue: #1a73e8; /* Consistent primary color */
      --secondary-dark: #34476a;
      --bg-color: #f0f4f8; /* Light gray-blue background */
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ffb300;
      --shadow-lift: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    body { 
        font-family: 'Inter', sans-serif; 
        padding: 40px 20px; 
        background: var(--bg-color); 
        color: var(--text-color);
    }
    
    /* 2. Enhanced Card Style */
    .card { 
        max-width:700px; 
        margin:auto; 
        background:var(--card-bg); 
        padding:35px; 
        border-radius:12px; 
        box-shadow: var(--shadow-lift); 
        border: 1px solid #e0e6eb;
    }
    h1 { 
        text-align:center; 
        color:var(--primary-blue); 
        font-weight: 700;
        margin-bottom: 25px;
    }
    h3 { 
        margin-top: 30px; 
        border-top: 1px solid #e0e6eb; 
        padding-top: 20px; 
        color: var(--secondary-dark);
        font-weight: 600;
        font-size: 1.25rem;
    }
    .row { 
        margin:15px 0; 
        display:flex; 
        gap:15px; 
        align-items:center; 
        flex-wrap: wrap;
    }
    
    /* 3. Button Styles (Unified Look) */
    button { 
        padding:12px 18px; 
        border:0; 
        border-radius:8px; 
        cursor:pointer; 
        font-weight: 600; 
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 10px rgba(0,0,0,0.15);
    }
    
    /* Color mapping to new palette */
    #connectButton { background:var(--primary-blue); color:#fff; }
    #connectButton:hover { background: #1558b3; }
    
    #disconnectButton { background:#95a5a6; color:#fff; }
    #disconnectButton:hover { background: #7f8c8d; }
    
    #registerButton { background:var(--success); color:#fff; }
    #registerButton:hover { background: #1e7e34; }
    
    #authButton { background:var(--warning); color:var(--text-color); }
    #authButton:hover { background: #e09b00; }
    
    #deactivateButton { background:var(--danger); color:#fff; }
    #deactivateButton:hover { background: #b02a37; }

    #rotateButton, .row button:not(#registerButton):not(#authButton):not(#deactivateButton) { 
        background: var(--secondary-dark); 
        color: #fff; 
        flex-grow: 1;
    }
    #rotateButton:hover, .row button:hover { background: #2c3a57; }
    
    /* 4. Status Messages */
    .status { 
        padding:12px 15px; 
        border-radius:8px; 
        margin-bottom:15px; 
        font-size: 0.95em;
        font-weight: 500;
        border-left: 5px solid;
    }
    .ok { background:#e8f5e9; color:var(--success); border-color:var(--success); }
    .err { background:#ffebee; color:var(--danger); border-color:var(--danger); }
    
    /* 5. Input Field Styling */
    input[type="text"] { 
        width:100%;
        padding:10px 12px;
        border-radius:8px;
        border:1px solid #ced4da;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }
    input[type="text"]:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        outline: none;
    }
    label {
        font-weight: 600;
        color: var(--secondary-dark);
        display: block;
        margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Privacy-Preserving Auth — Portal</h1>

    <div id="status" class="status err">Status: Wallet Disconnected.</div>
    <div class="row">
      <div style="flex:1;">Current Account: <strong id="currentAccount">N/A</strong></div>
      <div>Network: <strong id="networkName">N/A</strong></div>
    </div>

    <div class="row">
      <button id="connectButton" onclick="connectWallet()">Connect MetaMask</button>
      <button id="disconnectButton" onclick="disconnect()" style="display:none;">Disconnect</button>
    </div>

    <h3>Registration & Authentication</h3>
    <div class="row">
      <button id="registerButton" onclick="registerUser()">Register</button>
      <button id="authButton" onclick="authenticateUser()">Authenticate (Login)</button>
      <button id="deactivateButton" onclick="deactivateAccount()">Deactivate My Account</button>
    </div>
    <div id="registerMessage" class="status" style="display:none;"></div>
    <div id="authMessage" class="status" style="display:none;"></div>

    <h3>DID Key Rotation</h3>
    <div>
      <label>New Wallet Address (Future DID Key):</label>
      <input id="newWalletAddress" type="text" placeholder="0x..." style="margin-bottom: 10px;">
      <div class="row">
        <button id="rotateButton" onclick="updateDID()">Rotate DID Key</button>
      </div>
      <p style="font-size: 0.85em; color: #555; margin-top: 5px;">
        Warning: This transfers your registration and all data to the new address.
        You must confirm this transaction using your *current* wallet.
      </p>
      <div id="rotateMessage" class="status" style="display:none; margin-top: 10px;"></div>
    </div>


    <h3>Profile</h3>
    <div>
      <label>Profile CID (IPFS) or public pointer</label>
      <input id="profileCid" type="text" placeholder="Qm..." style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;">
      <div class="row"><button onclick="setProfileCid()">Save Profile CID</button></div>
      <div id="profileMessage" class="status" style="display:none;"></div>
    </div>
  </div>

  <script>
    // ⚠️ PASTE YOUR *NEW* AuthManager CONTRACT ADDRESS HERE
    const CONTRACT_ADDRESS = "0xAF83CC47bE66d4BE1ea74F1f23e4452fa3c76F4b";
    
    // MODIFIED ABI: 'authenticateWithSignature' is now a view function
    const CONTRACT_ABI = [
      "function register() public",
      "function deactivateAccount() public",
      "function setProfileCID(string calldata cid) external",
      "function isRegistered(address user) external view returns (bool)",
      "function updateDID(address newWallet) external", 
      
      // NEW FUNCTIONS FOR SECURE AUTH (Challenge-Response)
      "function getNonce(address user) external view returns (uint256)", 
      // CRITICAL ABI FIX: Now takes signature AND nonce, and is a view function
      "function authenticateWithSignature(bytes calldata signature, uint256 nonce) external view returns (bool)", 
      "event UserAccess(address indexed user, uint256 timestamp)",
      "event Authenticated(address indexed user, uint256 timestamp, uint256 nonce)"
    ];

    let provider, signer, contract, currentAccount;

    function el(id){ return document.getElementById(id); }
    function showStatus(t, ok=true){ el('status').textContent='Status: '+t; el('status').className='status '+(ok?'ok':'err'); }
    function showMsg(id,t,ok=true){ const m=el(id); m.style.display='block'; m.textContent=t; m.className='status '+(ok?'ok':'err'); setTimeout(()=>m.style.display='none',5000); }

    async function connectWallet(){
      if(!window.ethereum){showMsg('authMessage','MetaMask not installed',false);return;}
      provider=new ethers.providers.Web3Provider(window.ethereum);await provider.send("eth_requestAccounts",[]);
      signer=provider.getSigner();currentAccount=await signer.getAddress();
      contract=new ethers.Contract(CONTRACT_ADDRESS,CONTRACT_ABI,signer);
      const n=await provider.getNetwork();el('currentAccount').textContent=currentAccount;el('networkName').textContent=n.name;showStatus('Connected',true);
      el('connectButton').style.display='none';el('disconnectButton').style.display='inline-block';
    }
    
    function disconnect(){provider=null;signer=null;contract=null;currentAccount=null;el('currentAccount').textContent='N/A';el('networkName').textContent='N/A';showStatus('Disconnected',false);el('connectButton').style.display='inline-block';el('disconnectButton').style.display='none';}
    
    async function registerUser(){if(!contract){showMsg('registerMessage','Connect wallet first',false);return;}try{const tx=await contract.register();showMsg('registerMessage','Confirm registration in MetaMask...');await tx.wait();showMsg('registerMessage','Registered successfully!');}catch(e){showMsg('registerMessage', e.error?.message || e.message || 'Registration failed.',false);}}
    
    // FINAL SECURE AUTHENTICATION FUNCTION (Single Signature, No Transaction)
    async function authenticateUser(){
      if(!contract){showMsg('authMessage','Connect wallet first',false);return;}
      
      try {
        // --- STEP 1: Get the current nonce/challenge from the contract ---
        const nonceBigNum = await contract.getNonce(currentAccount);
        const nonce = nonceBigNum.toNumber();

        // --- STEP 2: Create the exact challenge message string (human-readable) ---
        const challengeMessage = `UniversityPortalLogin:${nonce}`;
        
        // --- STEP 3: Sign the message with the current wallet (MetaMask prompt) ---
        showMsg('authMessage',`Confirm the login signature in MetaMask. Challenge: ${challengeMessage}`, true);
        const signature = await signer.signMessage(challengeMessage); 

        // --- STEP 4: Send the signature and nonce to the contract for VERIFICATION (READ-ONLY) ---
        showMsg('authMessage','Signature confirmed. Verifying credentials...', true);
        
        // Use the provider instance for READ-ONLY calls. We use callStatic to simulate the transaction.
        const readOnlyContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
        
        // Pass signature AND nonce, and explicitly set the caller address ('from') for msg.sender in the contract
        const isAuthenticated = await readOnlyContract.callStatic.authenticateWithSignature(
            signature, 
            nonce, 
            { from: currentAccount }
        );
        
        if (isAuthenticated) {
            // Since the contract no longer logs access, we should call a separate logging function 
            // if we want to track logins (this would be the transaction popup now).
            // For a truly single pop-up experience, we skip logging and trust the signature verification.
            
            showMsg('authMessage','✅ Authentication successful! Access granted.', true);
            setTimeout(()=>window.location.href='dashboard.html', 1500); 
        } else {
            // This path should not be hit if the contract reverted with an error, 
            // but is a fallback for safety.
            showMsg('authMessage','Authentication Failed: Signature verified but nonce was invalid.', false);
        }

      } catch (e) {
          console.error("Authentication Error:", e);
          const errorMsg = e.error?.message || e.message || 'Authentication failed. Check console for details.';
          if (errorMsg.includes('User denied transaction signature')) {
             showMsg('authMessage', 'Login attempt cancelled by user.', false);
          } else {
             // The contract error message is usually embedded here: "execution reverted: Authentication Failed: Invalid signature or message"
             showMsg('authMessage', `Authentication Failed: ${errorMsg}`, false);
          }
      }
    }
    
    async function deactivateAccount(){if(!contract){showMsg('registerMessage','Connect wallet first',false);return;}try { const tx=await contract.deactivateAccount(); showMsg('registerMessage', 'Confirm deactivation in MetaMask...'); await tx.wait(); showMsg('registerMessage','Account deactivated successfully.');} catch(e) { showMsg('registerMessage', e.error?.message || e.message || 'Deactivation failed.', false); }}
    
    async function setProfileCid(){if(!contract){showMsg('profileMessage','Connect wallet first',false);return;}const cid=el('profileCid').value.trim();if(!cid){showMsg('profileMessage','Please enter a Profile CID or pointer.',false);return;}try{const tx=await contract.setProfileCID(cid); showMsg('profileMessage', 'Confirm saving profile CID in MetaMask...'); await tx.wait();showMsg('profileMessage','Profile CID saved successfully!');} catch(e) {showMsg('profileMessage', e.error?.message || e.message || 'Failed to save Profile CID.',false);}}

    async function updateDID() {
      if (!contract) { showMsg('rotateMessage', 'Connect wallet first', false); return; }
      
      const newWallet = el('newWalletAddress').value.trim();
      
      if (!ethers.utils.isAddress(newWallet)) {
        showMsg('rotateMessage', 'Please enter a valid Ethereum address for the new wallet.', false);
        return;
      }

      if (newWallet.toLowerCase() === currentAccount.toLowerCase()) {
        showMsg('rotateMessage', 'New wallet address cannot be the same as the current one.', false);
        return;
      }
      
      try {
        showMsg('rotateMessage', `Confirm key rotation to ${newWallet} in MetaMask...`, true);
        const tx = await contract.updateDID(newWallet);
        await tx.wait();
        
        showMsg('rotateMessage', `✅ DID successfully rotated! Your identity is now controlled by ${newWallet}. Please disconnect and reconnect with the new wallet.`, true, 8000);
        disconnect(); 
        
      } catch (e) {
        console.error("Key Rotation Error:", e);
        showMsg('rotateMessage', e.error?.message || e.message || 'Key rotation failed. Check console for details.', false);
      }
    }

    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', (accounts) => {
            if (accounts.length === 0) {
              disconnect();
            } else {
              window.location.reload(); 
            }
        });
        window.ethereum.on('chainChanged', (chainId) => {
            window.location.reload();
        });
    }

  </script>
</body>
</html>
