<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments & File Submissions</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #273c75;
      --primary-hover: #40739e;
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --text-light: #7f8fa6;
      --border-color: #dfe4ea;
      --success-color: #43a047;
      --danger-color: #c23616;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    body {
      font-family: "Poppins", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 30px;
      box-shadow: var(--shadow);
      margin-bottom: 25px;
    }
    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 30px;
    }
    h2 {
      color: var(--primary-hover);
      margin-top: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-success {
      background-color: var(--success-color);
      color: white;
    }
    .btn-success:hover {
      background-color: #388e3c;
    }
    .btn-danger {
      background-color: var(--danger-color);
      color: white;
    }
    .btn-back {
        background-color: #7f8fa6;
        color: white;
        margin-bottom: 20px;
    }
    input[type="text"], input[type="date"] {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      margin-bottom: 15px;
      font-family: inherit;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .status-message {
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
    }
    .status-success {
      background-color: #e8f5e9;
      color: var(--success-color);
      border: 1px solid #c8e6c9;
    }
    .status-error {
      background-color: #ffebee;
      color: var(--danger-color);
      border: 1px solid #ffcdd2;
    }
    
    /* Submission Box Styles */
    #submissionBoxes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }
    .box-item {
        border: 2px solid var(--primary-color);
        border-radius: 12px;
        padding: 20px;
        background: #fdfdff;
        position: relative;
    }
    .box-item h3 {
        margin-top: 0;
        color: var(--primary-color);
    }
    .box-item p {
        margin: 5px 0;
        font-size: 14px;
    }
    .submission-area {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px dashed var(--border-color);
    }
    .submission-area input[type="text"] {
        margin-bottom: 10px;
    }
    .submission-status-msg {
        font-size: 13px;
        margin-top: 10px;
        display: block;
    }
    .submission-status-msg.submitted {
        color: var(--success-color);
        font-weight: 600;
    }
    .submission-status-msg.not-submitted {
        color: var(--text-light);
    }
    .role-info {
        text-align: center;
        margin-bottom: 25px;
        padding: 15px;
        border-radius: 10px;
        background-color: #fff8e1;
        border: 1px solid #ffecb3;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    
    <h1>📁 Assignment & File Submission Portal</h1>

    <div id="wallet-status-info" class="role-info">
      Please connect your wallet...
    </div>

    <div id="createBoxSection" class="card" style="display:none;">
      <h2>📝 Create New Assignment Box (Teacher Role Required)</h2>
      <div class="form-group">
        <label for="boxTitle">Assignment Title:</label>
        <input type="text" id="boxTitle" placeholder="e.g., Final Project Submission" />
      </div>
      <div class="form-group">
        <label for="boxDueDate">Due Date:</label>
        <input type="date" id="boxDueDate" />
      </div>
      <button id="createBoxBtn" class="btn btn-primary">Create Box</button>
      <div id="createBoxStatus" class="status-message" style="display:none;"></div>
    </div>

    <div class="card">
        <h2 id="submissionHeader">📦 Available Submission Boxes</h2>
        <div id="submissionBoxes">
            <p id="loadingMessage">Loading boxes...</p>
        </div>
    </div>

  </div>

  <script>
    // --- CONTRACT ADDRESSES & ABIs ---
    
    // The AuthManager address is used to check the user's role
    const AUTH_MANAGER_ADDRESS = "0xE71c11CF485D9ac41f051b20018CF2d2bD1d2ABe"; 
    const AUTH_MANAGER_ABI = [
      "function getMyRole() view returns (string memory)" 
    ];

    // The FileRegistry address is used for creating boxes and submitting files
    const FILE_REGISTRY_ADDRESS = "0xf26085e19d12B856cf10b91E498916C01ebaaB29"; // Placeholder, replace with your actual deployed FileRegistry address
    const FILE_REGISTRY_ABI = [
      "function createBox(string calldata title, string calldata dueDate) external",
      "function submitFile(uint256 boxId, string calldata fileName) external",
      "function getBoxCount() public view returns (uint256)",
      "function submissionBoxes(uint256) public view returns (string title, string dueDate, address teacher, uint256 submissionCount)",
      "function getSubmissionFileName(uint256 boxId, address student) public view returns (string memory)",
      "event BoxCreated(uint256 indexed boxId, address indexed teacher, string title)",
      "event FileSubmitted(uint256 indexed boxId, address indexed student, string fileName)"
    ];

    let provider, signer, fileRegistryContract, authManagerContract, currentAccount, userRole = 'N/A';

    // --- UI Helpers ---
    function el(id) { return document.getElementById(id); }
    function setStatus(id, text, isError = false) {
      const elStatus = el(id);
      elStatus.textContent = text;
      elStatus.className = 'status-message ' + (isError ? 'status-error' : 'status-success');
      elStatus.style.display = 'block';
      setTimeout(() => elStatus.style.display = 'none', 5000);
    }
    function shortAddr(a) {
      return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "0x0";
    }

    // --- Initialization and Role Check ---

    async function init() {
      if (typeof window.ethereum === "undefined") {
        el('wallet-status-info').textContent = "MetaMask not found. Please install and connect.";
        return;
      }
      
      provider = new ethers.providers.Web3Provider(window.ethereum);
      
      try {
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        currentAccount = await signer.getAddress(); 
        
        // Initialize contracts
        authManagerContract = new ethers.Contract(AUTH_MANAGER_ADDRESS, AUTH_MANAGER_ABI, signer);
        fileRegistryContract = new ethers.Contract(FILE_REGISTRY_ADDRESS, FILE_REGISTRY_ABI, signer);

        // Check and display user role
        userRole = await authManagerContract.getMyRole();
        el('wallet-status-info').innerHTML = `
            Connected as: <strong>${shortAddr(currentAccount)}</strong> <br/>
            Your Role: <strong>${userRole || 'N/A (Default: Member)'}</strong>
        `;

        // Only show "Create Box" if user is a teacher
        if (userRole.toLowerCase() === 'teacher' || userRole.toLowerCase() === 'admin') {
          el('createBoxSection').style.display = 'block';
          el('createBoxBtn').onclick = handleCreateBox;
        }

        // Listen for events and load existing boxes
        fileRegistryContract.on("BoxCreated", () => loadBoxes(fileRegistryContract));
        fileRegistryContract.on("FileSubmitted", () => loadBoxes(fileRegistryContract));
        
        await loadBoxes(fileRegistryContract);

      } catch (err) {
        console.error("Initialization error:", err);
        el('wallet-status-info').textContent = `Connection/Initialization Error. ${err.message}`;
        el('loadingMessage').textContent = "Could not load boxes due to connection error.";
      }
    }

    // --- Teacher Functions (Create Box) ---

    async function handleCreateBox() {
      const title = el('boxTitle').value.trim();
      const dueDate = el('boxDueDate').value.trim();

      if (!title) return setStatus('createBoxStatus', 'Title cannot be empty.', true);
      if (!dueDate) return setStatus('createBoxStatus', 'Due Date cannot be empty.', true);

      try {
        setStatus('createBoxStatus', 'Creating box... Confirm transaction in MetaMask.', false);
        const tx = await fileRegistryContract.createBox(title, dueDate);
        await tx.wait();
        setStatus('createBoxStatus', 'Assignment Box Created Successfully!', false);
        el('boxTitle').value = '';
        el('boxDueDate').value = '';
      } catch (err) {
        console.error("Create Box Error:", err);
        setStatus('createBoxStatus', `Creation Failed: ${err.error?.message || err.message}`, true);
      }
    }

    // --- Student/User Functions (File Submission) ---
    
    // The contract only stores the *name* of the file (a pointer like IPFS CID or just a name).
    async function handleSubmitFile(boxId) {
        if (!fileRegistryContract) return alert("Wallet not connected.");
        const inputId = `fileNameInput-${boxId}`;
        const statusId = `submissionStatus-${boxId}`;
        const fileName = el(inputId).value.trim();

        if (!fileName) return setStatus(statusId, 'File name/pointer cannot be empty.', true);

        try {
            setStatus(statusId, 'Submitting file... Confirm transaction in MetaMask.', false);
            
            // NOTE: The modifier 'onlyTeacher' is skipped on the client side in the contract.
            // A student/user can submit their file if they are registered.
            const tx = await fileRegistryContract.submitFile(boxId, fileName);
            await tx.wait();

            setStatus(statusId, `File submitted successfully! Name: ${shortAddr(fileName)}`, false);
            el(inputId).value = '';
            // Refresh boxes to show the new submission status
            await loadBoxes(fileRegistryContract); 

        } catch (err) {
            console.error(`Submission Error for Box ${boxId}:`, err);
            setStatus(statusId, `Submission Failed: ${err.error?.message || err.message}`, true);
        }
    }
    
    // --- Display Boxes ---

    async function loadBoxes(contractInstance) {
      const boxListEl = el('submissionBoxes');
      boxListEl.innerHTML = ''; 
      el('loadingMessage').style.display = 'block';

      try {
        const countBigNum = await contractInstance.getBoxCount();
        const count = countBigNum.toNumber();

        if (count === 0) {
            el('loadingMessage').textContent = "No assignment boxes have been created yet.";
            return;
        }
        
        el('loadingMessage').style.display = 'none'; // Hide loading message if boxes exist

        // Load boxes in reverse order to show the newest first
        for (let i = count - 1; i >= 0; i--) {
            // Retrieve box details (title, dueDate, teacher, submissionCount)
            const box = await contractInstance.submissionBoxes(i);
            
            // Retrieve student's submission status for the current box
            let submittedFileName = "N/A";
            let submissionHtml = '';
            let submissionStatus = '';

            // Check if the current account has submitted a file
            if (currentAccount) {
                 submittedFileName = await contractInstance.getSubmissionFileName(i, currentAccount);
            }
            
            const isSubmitted = submittedFileName && submittedFileName.length > 0;
            
            if (isSubmitted) {
                submissionStatus = `<span class="submission-status-msg submitted">Submitted! File: <strong>${submittedFileName}</strong></span>`;
                submissionHtml = submissionStatus;
            } else {
                // If not submitted (or if the user is the teacher), allow submission
                if (userRole.toLowerCase() !== 'teacher' && userRole.toLowerCase() !== 'admin') {
                     submissionStatus = `<span id="submissionStatus-${i}" class="submission-status-msg not-submitted">Not submitted yet.</span>`;
                     submissionHtml = `
                        <div class="submission-area">
                            <h4>Submit Your File</h4>
                            <input type="text" id="fileNameInput-${i}" placeholder="Enter file CID or name (e.g., Qm...)" />
                            <button class="btn btn-success" onclick="handleSubmitFile(${i})">Submit File</button>
                            ${submissionStatus}
                        </div>
                    `;
                } else {
                    submissionHtml = `<div class="submission-area">
                        <span class="submission-status-msg submitted">Teacher's View: ${box.submissionCount.toNumber()} submission(s) received.</span>
                        <p style="font-size:12px; margin-top:5px; color:#555;">Teacher's can't submit to their own boxes. Use an Admin/Student account to test submission.</p>
                    </div>`;
                }
            }


            const boxElement = document.createElement("div");
            boxElement.className = "box-item";
            boxElement.innerHTML = `
                <h3>${box.title} (Box ID: ${i})</h3>
                <p><strong>Due Date:</strong> ${box.dueDate}</p>
                <p><strong>Created By:</strong> ${shortAddr(box.teacher)}</p>
                <p><strong>Submissions:</strong> ${box.submissionCount.toNumber()}</p>
                ${submissionHtml}
            `;
            boxListEl.appendChild(boxElement);
        }

      } catch (err) {
        console.error("Load boxes error:", err);
        el('loadingMessage').textContent = `Error loading boxes: ${err.message}`;
        el('loadingMessage').style.display = 'block';
      }
    }


    window.onload = init;

    // Reload on account/network change
    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
