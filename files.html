<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments & File Submissions</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #273c75;
      --primary-hover: #40739e;
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --text-light: #7f8fa6;
      --border-color: #dfe4ea;
      --success-color: #43a047;
      --danger-color: #c23616;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    body { font-family: "Poppins", sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 30px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 15px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 25px; }
    h1 { color: var(--primary-color); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
    .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background-color 0.2s; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-success { background-color: var(--success-color); color: white; }
    .btn-success:hover { background-color: #388e3c; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; text-align: center; }
    .ok { background: #e8f5e9; color: #1b5e20; }
    .err { background: #ffebee; color: #b71c1c; }
    
    /* Submission Box Styles */
    #submissionBoxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .box-item { border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; background: #fcfcfc; }
    .box-item h3 { margin-top: 0; color: var(--primary-color); }
    .box-item p { font-size: 14px; margin: 5px 0; }
    .overdue { color: var(--danger-color); font-weight: 600; }
    .submission-area { margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
    .submission-area input[type="text"], .submission-area input[type="file"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn btn-primary" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    <div class="card" style="margin-top: 20px;">
      <h1>Assignments & Submissions</h1>
      <div id="connectionStatus" class="status err">Wallet Disconnected.</div>
      <div id="roleInfo" style="font-size: 14px; margin-bottom: 15px;">Your Role: <strong>Loading...</strong></div>

      <div id="createBoxSection" class="card" style="display: none; background: #e8f5e9; border: 1px solid #c8e6c9;">
        <h2>📝 Create New Submission Box (Admin/Teacher Only)</h2>
        <input type="text" id="boxTitle" placeholder="Assignment Title" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc;">
        <label for="boxDeadline" style="display: block; margin-bottom: 5px; font-size: 14px;">Submission Deadline (UNIX Timestamp or Date/Time Input):</label>
        <input type="text" id="boxDeadline" placeholder="e.g., 1764672000 (UNIX Timestamp)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc;">
        <button id="createBoxBtn" class="btn btn-success" onclick="createSubmissionBox()">Create Box</button>
        <div id="createBoxStatus" style="margin-top: 10px; font-size: 14px;"></div>
      </div>

      <h2>Active Assignments</h2>
      <div id="submissionBoxes">
        <p id="noBoxes">Loading submission boxes...</p>
      </div>
    </div>
  </div>

  <script>
    // --- CONTRACT ADDRESSES ---
    const AUTH_MANAGER_ADDRESS = "0xE71c11CF485D9ac41f051b20018CF2d2bD1d2ABe"; // From admin.html
    const SUBMISSION_MANAGER_ADDRESS = "0x[YOUR_SUBMISSION_MANAGER_CONTRACT_ADDRESS]"; // REPLACE WITH YOUR DEPLOYED ADDRESS

    // --- ABIs ---
    const AUTH_MANAGER_ABI = [
      "function getMyRole() external view returns (string memory)",
      "function getRole(address user) external view returns (string memory)"
    ];
    
    // Minimal ABI for the functions we need
    const SUBMISSION_MANAGER_ABI = [
      "function createSubmissionBox(string calldata _title, uint256 _deadline) external",
      "function submitFile(uint256 _boxId, string calldata _fileCID) external",
      "function getSubmissionBoxCount() external view returns (uint256)",
      "function submissionBoxes(uint256) external view returns (string title, address createdBy, uint256 deadline, bool isOpen)" 
      // NOTE: Getting the submissions array requires a separate view function on the contract
    ];

    let provider, signer, subManagerContract, authManagerContract, currentAccount, userRole;

    function el(id) { return document.getElementById(id); }
    function setStatus(text, isOk) { 
      const s = el('connectionStatus');
      s.textContent = text;
      s.className = 'status ' + (isOk ? 'ok' : 'err');
    }
    function showMsg(id, text, isOk, duration = 5000) {
      const d = el(id);
      d.style.display = 'block';
      d.textContent = text;
      d.className = isOk ? 'ok' : 'err';
      setTimeout(() => { d.style.display = 'none'; }, duration);
    }
    function shortAddr(a) { return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : ""; }
    function formatDeadline(timestamp) {
        if (timestamp.isZero() || timestamp.toNumber() === 0) return 'No Deadline';
        
        const ts = timestamp.toNumber();
        const date = new Date(ts * 1000);
        const now = Date.now();
        const isOverdue = (ts * 1000) < now;
        
        let formattedDate = date.toLocaleString();
        
        if (isOverdue) {
            return `<span class="overdue">Deadline: ${formattedDate} (Overdue)</span>`;
        }
        return `Deadline: ${formattedDate}`;
    }

    async function init() {
      if (typeof window.ethereum === "undefined") {
        setStatus("MetaMask not installed.", false);
        return;
      }

      try {
        setStatus('Connecting wallet...', true);
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        currentAccount = await signer.getAddress();
        
        subManagerContract = new ethers.Contract(SUBMISSION_MANAGER_ADDRESS, SUBMISSION_MANAGER_ABI, signer);
        authManagerContract = new ethers.Contract(AUTH_MANAGER_ADDRESS, AUTH_MANAGER_ABI, provider);

        userRole = await authManagerContract.getRole(currentAccount);
        if (userRole === "") userRole = "member/student"; 
        
        el('roleInfo').innerHTML = `Your Role: <strong>${userRole.toUpperCase()}</strong>`;
        setStatus(`Connected as ${shortAddr(currentAccount)}`, true);
        
        if (userRole === 'admin' || userRole === 'teacher') {
            el('createBoxSection').style.display = 'block';
        }

        await loadSubmissionBoxes();

      } catch (error) {
        console.error("Initialization error:", error);
        setStatus(`Error: Could not connect or verify role. ${error.message}`, false);
        el('noBoxes').textContent = "Could not load data. Check console for contract errors.";
      }
    }
    
    // --- TEACHER/ADMIN FUNCTION ---
    async function createSubmissionBox() {
        const title = el('boxTitle').value.trim();
        const deadlineInput = el('boxDeadline').value.trim();
        
        if (!title) return showMsg('createBoxStatus', 'Title is required.', false);
        
        let deadline = 0;
        if (deadlineInput) {
            // Simple check: assume user inputs a UNIX timestamp
            deadline = parseInt(deadlineInput);
            if (isNaN(deadline) || deadline < 0) {
                 return showMsg('createBoxStatus', 'Invalid deadline timestamp.', false);
            }
        }

        try {
            showMsg('createBoxStatus', 'Sending transaction to create box... Confirm in MetaMask.', true, 0);
            const tx = await subManagerContract.createSubmissionBox(title, deadline);
            await tx.wait();
            
            showMsg('createBoxStatus', 'Submission Box Created Successfully!', true);
            el('boxTitle').value = '';
            el('boxDeadline').value = '';
            await loadSubmissionBoxes(); // Reload the list
            
        } catch(err) {
            console.error("Create Box Error:", err);
            showMsg('createBoxStatus', `Failed: ${err.error?.message || err.message}`, false);
        }
    }

    // --- GENERAL FUNCTIONS ---
    async function loadSubmissionBoxes() {
        const listEl = el('submissionBoxes');
        listEl.innerHTML = '';
        listEl.appendChild(el('noBoxes'));
        el('noBoxes').textContent = "Loading submission boxes...";
        
        try {
            const countBigNum = await subManagerContract.getSubmissionBoxCount();
            const count = countBigNum.toNumber();
            
            if (count === 0) {
                el('noBoxes').textContent = "No submission boxes have been created yet.";
                return;
            }
            
            // Loop from newest to oldest
            for (let i = count - 1; i >= 0; i--) {
                const box = await subManagerContract.submissionBoxes(i);
                appendBoxToUI(i, box);
            }
            el('noBoxes').remove(); // Remove the loading message
            
        } catch(err) {
            console.error("Error loading boxes:", err);
            el('noBoxes').textContent = "Error loading submission boxes.";
        }
    }
    
    function appendBoxToUI(index, box) {
        const isOverdue = box.deadline.toNumber() !== 0 && (box.deadline.toNumber() * 1000) < Date.now();
        const listEl = el('submissionBoxes');
        const boxItem = document.createElement('div');
        boxItem.className = 'box-item';
        boxItem.id = `box-${index}`;
        
        let statusText = box.isOpen ? 'OPEN' : 'CLOSED';
        if (isOverdue) statusText = 'OVERDUE';

        boxItem.innerHTML = `
            <h3>${box.title} (#${index}) <span style="float:right; font-size:14px; color:${isOverdue ? 'red' : box.isOpen ? 'green' : 'gray'};">${statusText}</span></h3>
            <p><strong>Created By:</strong> ${shortAddr(box.createdBy)}</p>
            <p>${formatDeadline(box.deadline)}</p>
            
            <div class="submission-area">
                <h4>Your Submission</h4>
                <input type="file" id="fileInput-${index}"> 
                
                <input type="text" id="cidInput-${index}" placeholder="Enter IPFS File CID (e.g., Qm...)" style="margin-top: 5px;">
                
                <button class="btn btn-primary" onclick="submitFileCID(${index})">Submit File CID</button>
                <div id="submitStatus-${index}" style="margin-top: 10px; font-size: 14px;"></div>
                
                </div>
        `;
        listEl.appendChild(boxItem);
    }
    
    // --- STUDENT/MEMBER FUNCTION ---
    async function submitFileCID(index) {
        if (!subManagerContract) return alert("Please connect your wallet.");
        
        // In a real app, you'd handle the file upload here, get the CID, and use it below.
        // For this example, we'll use the manual input field.
        const cid = el(`cidInput-${index}`).value.trim();
        const statusEl = el(`submitStatus-${index}`);
        
        if (!cid) {
            showMsg(`submitStatus-${index}`, 'Please enter a valid IPFS CID or upload a file.', false);
            return;
        }
        
        if (!confirm(`Are you sure you want to submit CID ${cid} to box #${index}?`)) return;

        try {
            showMsg(`submitStatus-${index}`, 'Sending transaction to submit CID... Confirm in MetaMask.', true, 0);
            
            const tx = await subManagerContract.submitFile(index, cid);
            await tx.wait();
            
            showMsg(`submitStatus-${index}`, `✅ Submission successful! CID: ${cid}`, true, 10000);
            el(`cidInput-${index}`).value = ''; // Clear input
            
        } catch(err) {
            console.error("Submission Error:", err);
            showMsg(`submitStatus-${index}`, `❌ Submission Failed: ${err.error?.message || err.message}`, false);
        }
    }

    window.onload = init;

    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
