<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments & Submissions</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#e8f5e9; color:#222; }
    .card { max-width:1000px; margin:auto; background:#fff; padding:30px; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.1); }
    h1 { text-align:center; color:#1b5e20; }
    h2 { color:#388e3c; border-bottom:2px solid #e8f5e9; padding-bottom:5px; margin-top:20px; }
    .status { padding:12px; border-radius:8px; margin-bottom:15px; text-align:center; font-weight: bold; }
    .ok { background:#e8f5e9; color:#1b5e20; border:1px solid #c8e6c9; }
    .err { background:#ffebee; color:#b71c1c; border:1px solid #ffcdd2; }
    .btn { padding:10px 15px; border:0; border-radius:6px; cursor:pointer; font-weight:600; transition: background-color 0.2s ease; }
    .btn-success { background:#43a047; color:#fff; }
    .btn-success:hover { background:#2e7d32; }
    .btn-primary { background:#1e88e5; color:#fff; }
    .btn-primary:hover { background:#1565c0; }
    .btn-back { background:#78909c; color:#fff; margin-top:30px; }
    
    .submission-box { border: 1px solid #c8e6c9; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    .submission-box h3 { color: #333; margin-top: 0; }
    .submission-box p { font-size: 14px; color: #555; }
    .upload-area { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    .upload-area input[type="file"] { flex-grow: 1; }
    #createBoxBtn { margin-bottom: 20px; }
    
    /* Create Box Modal Styles (Basic) */
    .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
    .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 600px; border-radius: 10px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 Assignment Submissions</h1>

    <div id="status" class="status err">Initializing...</div>
    <div id="walletInfo" class="ok" style="display:none;">
        <p>Wallet: <strong id="currentAccount">N/A</strong> | Role: <strong id="userRole">Loading...</strong></p>
    </div>

    <button id="createBoxBtn" class="btn btn-success" style="display:none;" onclick="openCreateBoxModal()">
        + Create Submission Box (Admin/Teacher Only)
    </button>
    
    <hr />

    <section id="submissionList">
        <h2>Available Submissions</h2>
        <div id="boxesContainer">
            <p id="loadingMsg">Connecting to contract and loading submissions (requires backend)...</p>
            </div>
    </section>
    
    <button class="btn btn-back" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
  </div>
  
  <div id="createBoxModal" class="modal">
    <div class="modal-content">
      <h2>Create New Submission Box</h2>
      <input type="text" id="boxTitle" placeholder="Assignment Title (e.g., Final Project Report)">
      <textarea id="boxDescription" placeholder="Description..."></textarea>
      <input type="datetime-local" id="boxDeadline" value="2025-12-31T23:59">
      <input type="text" id="boxFormat" placeholder="File Format Restrictions (e.g., PDF, DOCX)">
      <input type="number" id="boxMaxSize" placeholder="Max File Size (MB)">
      <p id="modalStatus" class="err" style="display:none;"></p>
      <button class="btn btn-primary" onclick="handleCreateSubmissionBox()">Create Box</button>
      <button class="btn" onclick="closeCreateBoxModal()">Cancel</button>
    </div>
  </div>

  <script>
    // --- Configuration ---
    // AuthManager Contract Address (Same as index.html/admin.html)
    const AUTH_CONTRACT_ADDRESS = "0xE71c11CF485D9ac41f051b20018CF2d2bD1d2ABe";
    const AUTH_ABI = [
      "function getMyRole() view returns (string memory)", 
      "function isRegistered(address user) view returns (bool)"
    ];
    // NOTE: In a real app, submissions would also use a specific API endpoint/contract.
    
    let provider, signer, authContract, currentAccount, userRole;

    function el(id){ return document.getElementById(id); }
    function showStatus(text, ok=true) {
      const s = el('status');
      s.textContent = text;
      s.className = 'status ' + (ok ? 'ok' : 'err');
    }
    
    function shortAddr(a) {
      return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "";
    }
    
    function openCreateBoxModal() {
        el('createBoxModal').style.display = 'block';
    }
    
    function closeCreateBoxModal() {
        el('createBoxModal').style.display = 'none';
        el('modalStatus').style.display = 'none';
    }

    async function initPage() {
      if (typeof window.ethereum === "undefined") {
        showStatus("MetaMask not installed. Please install MetaMask.", false);
        el('loadingMsg').textContent = "MetaMask not found.";
        return;
      }

      try {
        showStatus('Connecting wallet and verifying role...', true);
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        currentAccount = await signer.getAddress();
        
        el('currentAccount').textContent = shortAddr(currentAccount);
        el('walletInfo').style.display = 'block';

        authContract = new ethers.Contract(AUTH_CONTRACT_ADDRESS, AUTH_ABI, provider); 
        
        // 1. Check if user is registered (essential security check)
        const isRegistered = await authContract.isRegistered(currentAccount);
        if (!isRegistered) {
            showStatus("❌ Access Denied. User is not registered.", false);
            el('loadingMsg').textContent = "Access Denied. Please register your account on the login page.";
            return;
        }

        // 2. Fetch User Role for RBAC
        userRole = await authContract.getMyRole();
        el('userRole').textContent = userRole || 'Student (Default)';

        // 3. Implement RBAC: Only Admin or Teacher can see the creation button
        if (userRole.toLowerCase() === 'admin' || userRole.toLowerCase() === 'teacher') {
          el('createBoxBtn').style.display = 'inline-block';
        }
        
        showStatus('Wallet Connected. Role Verified.', true);

        // 4. Load Submission Boxes (Simulated - Requires a real backend/API)
        loadSubmissionBoxes(); 

      } catch (error) {
        console.error("Initialization error:", error);
        showStatus(`Error: Could not connect or verify. ${error.message}`, false);
        el('loadingMsg').textContent = "Error during initialization.";
      }
    }
    
    // --- Backend/API Simulation Functions ---
    
    function loadSubmissionBoxes() {
        // --- NOTE: This function would make a fetch() call to your server ---
        el('loadingMsg').style.display = 'none'; 
        const container = el('boxesContainer');
        container.innerHTML = ''; // Clear loading message
        
        // Simulate a response from the Backend API
        const mockBoxes = [
            { id: 1, title: "Semester 1 Essay", desc: "A reflective essay on the course topics.", deadline: "2025-12-15 23:59", format: "PDF", maxSize: 10, creator: "0xTeac...h3rA" },
            { id: 2, title: "Lab Report 3", desc: "Experiment results and analysis.", deadline: "2025-12-01 17:00", format: "DOCX, PDF", maxSize: 5, creator: "0xTeac...h3rB" }
        ];

        if (mockBoxes.length === 0) {
            container.innerHTML = '<p>No active submission boxes found.</p>';
            return;
        }

        mockBoxes.forEach(box => {
            const boxEl = document.createElement('div');
            boxEl.className = 'submission-box';
            boxEl.innerHTML = `
                <h3>${box.title}</h3>
                <p><strong>Deadline:</strong> ${box.deadline} | <strong>Formats:</strong> ${box.format} | <strong>Max Size:</strong> ${box.maxSize} MB</p>
                <p>${box.desc}</p>
                <div class="upload-area">
                    <input type="file" id="file-${box.id}">
                    <button class="btn btn-primary" onclick="handleFileUpload(${box.id}, '${box.format}', ${box.maxSize})">Submit File</button>
                </div>
                <p id="upload-status-${box.id}" style="font-size: 12px; margin-top: 5px;"></p>
            `;
            container.appendChild(boxEl);
        });
    }

    async function handleCreateSubmissionBox() {
        // --- NOTE: This function would make a POST fetch() call to your server ---
        const title = el('boxTitle').value.trim();
        const desc = el('boxDescription').value.trim();
        const deadline = el('boxDeadline').value;
        const format = el('boxFormat').value.trim();
        const maxSize = el('boxMaxSize').value;
        
        if (!title || !desc || !deadline || !format || !maxSize) {
            el('modalStatus').textContent = "All fields must be filled.";
            el('modalStatus').style.display = 'block';
            return;
        }
        
        // Simulate API call success
        console.log("Simulating creation of new box:", { title, desc, deadline, format, maxSize, creator: currentAccount });
        el('modalStatus').className = 'ok';
        el('modalStatus').textContent = `Submission Box "${title}" successfully created! (Simulated)`;
        el('modalStatus').style.display = 'block';
        
        // In a real app, you would:
        // 1. fetch('POST /submissionbox', { body: JSON.stringify({...}) })
        // 2. Wait for confirmation.
        // 3. Close modal and refresh list:
        setTimeout(() => {
            closeCreateBoxModal();
            loadSubmissionBoxes(); // Refresh the list
        }, 2000);
    }
    
    async function handleFileUpload(boxId, allowedFormats, maxSizeBytes) {
        // --- NOTE: This function would make a file upload fetch() call to your server ---
        const fileInput = el(`file-${boxId}`);
        const statusEl = el(`upload-status-${boxId}`);
        const file = fileInput.files[0];

        if (!file) {
            statusEl.textContent = "Please select a file first.";
            statusEl.style.color = 'red';
            return;
        }

        // 1. File Validation
        const fileName = file.name;
        const fileExtension = fileName.split('.').pop().toUpperCase();
        const formatsArray = allowedFormats.split(',').map(f => f.trim().toUpperCase());
        const maxBytes = maxSizeBytes * 1024 * 1024; // MB to Bytes

        if (!formatsArray.includes(fileExtension)) {
            statusEl.textContent = `❌ Invalid format. Must be one of: ${allowedFormats}.`;
            statusEl.style.color = 'red';
            return;
        }

        if (file.size > maxBytes) {
            statusEl.textContent = `❌ File size (${(file.size / (1024 * 1024)).toFixed(2)}MB) exceeds limit of ${maxSizeBytes}MB.`;
            statusEl.style.color = 'red';
            return;
        }
        
        // 2. Upload Simulation
        statusEl.textContent = "Uploading file... (Simulated)";
        statusEl.style.color = 'orange';

        // In a real app, this is where you'd use FormData and fetch to upload:
        // const formData = new FormData();
        // formData.append('submission_file', file);
        // formData.append('boxId', boxId);
        // await fetch(`/upload/${boxId}`, { method: 'POST', body: formData });
        
        // Simulate success and notification logic
        setTimeout(() => {
            statusEl.textContent = `✅ File submitted successfully for Box ${boxId}!`;
            statusEl.style.color = 'green';
            // Trigger Notification Logic:
            // 1. Notify Student (User): Success message.
            // 2. Notify Admins/Teachers (via email/websocket from the backend)
            console.log(`[Notification] Student ${currentAccount} submitted file to box ${boxId}.`);

            fileInput.value = ''; // Clear file input
        }, 3000);
    }

    window.onload = initPage;

    if (typeof window.ethereum !== 'undefined') {
      window.ethereum.on('accountsChanged', () => window.location.reload());
      window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
