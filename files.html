<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments & File Submissions</title>
  <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { 
      --primary-color: #273c75;
      --primary-hover: #40739e;
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-color: #2f3640;
      --text-light: #7f8fa6;
      --border-color: #dfe4ea;
      --success-color: #43a047;
      --danger-color: #c23616;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    body { font-family: "Poppins", sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 30px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 15px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 25px; }
    h1 { color: var(--primary-color); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
    .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background-color 0.2s; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-success { background-color: #388e3c; color: white; }
    .btn-success:hover { background-color: #2e7d32; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; text-align: center; }
    .ok { background: #e8f5e9; color: #1b5e20; }
    .err { background: #ffebee; color: #b71c1c; }
    
    /* Submission Box Styles */
    #submissionBoxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .box-item { border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; background: #fcfcfc; }
    .box-item h3 { margin-top: 0; color: var(--primary-color); }
    .box-item p { font-size: 14px; margin: 5px 0; }
    .submission-area { margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
    .submission-area input[type="text"], .submission-area input[type="file"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    #submissionsList { background: #f0f0f0; padding: 10px; border-radius: 6px; margin-top: 10px; max-height: 150px; overflow-y: auto; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn btn-primary" onclick="window.location.href='secure.html'">← Back to Public Wall</button>
    <div class="card" style="margin-top: 20px;">
      <h1>Assignments & Submissions</h1>
      <div id="connectionStatus" class="status err">Wallet Disconnected.</div>
      <div id="roleInfo" style="font-size: 14px; margin-bottom: 15px;">Your Role: <strong>Loading...</strong></div>

      <div id="createBoxSection" class="card" style="display: none; background: #e8f5e9; border: 1px solid #c8e6c9;">
        <h2>📝 Create New Submission Box (Admin/Teacher Only)</h2>
        <input type="text" id="boxTitle" placeholder="Assignment Title" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc;">
        <label for="boxDeadline" style="display: block; margin-bottom: 5px; font-size: 14px;">Submission Deadline (Date/Text):</label>
        <input type="text" id="boxDeadline" placeholder="e.g., May 15, 2026" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc;">
        <button id="createBoxBtn" class="btn btn-success" onclick="createSubmissionBox()">Create Box</button>
        <div id="createBoxStatus" class="status" style="display:none; margin-top: 10px;"></div>
      </div>

      <h2>Active Assignments</h2>
      <div id="submissionBoxes">
        <p id="noBoxes">Loading submission boxes...</p>
      </div>
    </div>
  </div>

  <script>
    // --- CONTRACT ADDRESSES ---
    const AUTH_MANAGER_ADDRESS = "0xE71c11CF485D9ac41f051b20018CF2d2bD1d2ABe"; // AuthManager Address
    const FILE_REGISTRY_ADDRESS = "0x[YOUR_FILE_REGISTRY_CONTRACT_ADDRESS]"; // ⚠️ REPLACE THIS ADDRESS

    // --- ABIs ---
    const AUTH_MANAGER_ABI = [
      "function getRole(address user) external view returns (string memory)"
    ];
    
    // ABI for the FileRegistry contract (formerly SubmissionManager)
    const FILE_REGISTRY_ABI = [
      "function createBox(string calldata title, string calldata dueDate) external",
      "function submitFile(uint256 boxId, string calldata fileName) external",
      "function getBoxCount() external view returns (uint256)",
      "function getBoxDetails(uint256 boxId) public view returns (string memory title, string memory dueDate, address teacher, uint256 submissionCount)",
      "function getSubmissionFileName(uint256 boxId, address student) public view returns (string memory)"
    ];

    let provider, signer, fileRegistryContract, authManagerContract, currentAccount, userRole;

    function el(id) { return document.getElementById(id); }
    function setStatus(text, isOk) { 
      const s = el('connectionStatus');
      s.textContent = text;
      s.className = 'status ' + (isOk ? 'ok' : 'err');
    }
    function showMsg(id, text, isOk, duration = 5000) {
      const d = el(id);
      d.style.display = 'block';
      d.textContent = text;
      d.className = isOk ? 'ok' : 'err';
      if (duration > 0) setTimeout(() => { d.style.display = 'none'; }, duration);
    }
    function shortAddr(a) { return a ? `${a.slice(0, 6)}...${a.slice(-4)}` : ""; }

    async function init() {
      if (typeof window.ethereum === "undefined") {
        setStatus("MetaMask not installed.", false);
        return;
      }

      try {
        setStatus('Connecting wallet...', true);
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        currentAccount = await signer.getAddress();
        
        // Use signer for transactions (fileRegistryContract) and provider for reads (authManagerContract)
        fileRegistryContract = new ethers.Contract(FILE_REGISTRY_ADDRESS, FILE_REGISTRY_ABI, signer);
        authManagerContract = new ethers.Contract(AUTH_MANAGER_ADDRESS, AUTH_MANAGER_ABI, provider);

        userRole = await authManagerContract.getRole(currentAccount);
        if (userRole === "") userRole = "member/student"; 
        
        el('roleInfo').innerHTML = `Your Role: <strong>${userRole.toUpperCase()}</strong>`;
        setStatus(`Connected as ${shortAddr(currentAccount)}`, true);
        
        if (userRole === 'admin' || userRole === 'teacher') {
            el('createBoxSection').style.display = 'block';
        }

        await loadSubmissionBoxes();

      } catch (error) {
        console.error("Initialization error:", error);
        setStatus(`Error: Could not connect or verify role. ${error.message}`, false);
        const noBoxesEl = el('noBoxes');
        if (noBoxesEl) noBoxesEl.textContent = "Could not load data. Check console for contract errors.";
      }
    }
    
    // --- TEACHER/ADMIN FUNCTION ---
    async function createSubmissionBox() {
        if (!fileRegistryContract) return showMsg('createBoxStatus', 'Wallet not connected.', false);
        
        const title = el('boxTitle').value.trim();
        const dueDate = el('boxDeadline').value.trim() || 'N/A';
        
        if (!title) return showMsg('createBoxStatus', 'Title is required.', false);
        
        try {
            showMsg('createBoxStatus', 'Sending transaction to create box... Confirm in MetaMask.', true, 0);
            const tx = await fileRegistryContract.createBox(title, dueDate);
            await tx.wait();
            
            showMsg('createBoxStatus', 'Submission Box Created Successfully!', true);
            el('boxTitle').value = '';
            el('boxDeadline').value = '';
            await loadSubmissionBoxes(); // Reload the list
            
        } catch(err) {
            console.error("Create Box Error:", err);
            // The error message from the smart contract should be visible here
            showMsg('createBoxStatus', `Failed: ${err.error?.message || err.message || 'Transaction failed.'}`, false);
        }
    }

    // --- GENERAL FUNCTIONS ---
    async function loadSubmissionBoxes() {
        const listEl = el('submissionBoxes');
        const noBoxesEl = el('noBoxes'); 
        
        // Clear the list while preserving the noBoxes element
        listEl.innerHTML = '';
        if (noBoxesEl) {
            listEl.appendChild(noBoxesEl); 
            noBoxesEl.textContent = "Loading submission boxes...";
        }
        
        try {
            const countBigNum = await fileRegistryContract.getBoxCount();
            const count = countBigNum.toNumber();
            
            if (count === 0) {
                if (noBoxesEl) noBoxesEl.textContent = "No submission boxes have been created yet.";
                return;
            }
            
            // Clear the loading message now that we have posts
            if (noBoxesEl) noBoxesEl.remove(); 
            
            // Loop from newest to oldest
            for (let i = count - 1; i >= 0; i--) {
                // Returns: title, dueDate, teacher, submissionCount
                const box = await fileRegistryContract.getBoxDetails(i);
                const submissionCID = await fileRegistryContract.getSubmissionFileName(i, currentAccount || "0x0000000000000000000000000000000000000001");
                appendBoxToUI(i, box, submissionCID);
            }

        } catch(err) {
            console.error("Error loading boxes:", err);
            if (noBoxesEl) noBoxesEl.textContent = "Error loading submission boxes. (Check contract address)";
        }
    }
    
    function appendBoxToUI(index, box, submissionCID) {
        const listEl = el('submissionBoxes');
        const boxItem = document.createElement('div');
        boxItem.className = 'box-item';
        boxItem.id = `box-${index}`;
        
        const hasSubmitted = submissionCID && submissionCID.length > 0;

        boxItem.innerHTML = `
            <h3>${box.title} (#${index}) <span style="float:right; font-size:14px; color:${hasSubmitted ? 'green' : 'gray'};">${hasSubmitted ? 'Submitted' : 'Pending'}</span></h3>
            <p><strong>Created By:</strong> ${shortAddr(box.teacher)}</p>
            <p><strong>Due Date:</strong> ${box.dueDate}</p>
            <p><strong>Total Submissions:</strong> ${box.submissionCount}</p>
            
            <div class="submission-area">
                <h4>Your Submission (IPFS CID)</h4>
                ${hasSubmitted 
                    ? `<p style="color: green; word-break: break-all;">✅ Submitted CID: <strong>${submissionCID}</strong></p>`
                    : `<input type="text" id="cidInput-${index}" placeholder="Enter IPFS File CID (e.g., Qm...)" style="margin-top: 5px;">
                       <button class="btn btn-primary" onclick="submitFileCID(${index})">Submit File CID</button>`
                }
                <div id="submitStatus-${index}" class="status" style="display:none; margin-top: 10px;"></div>
                
                ${(userRole === 'admin' || userRole === 'teacher') ? 
                    `<div style="margin-top: 15px;">
                        <button class="btn btn-success" onclick="viewSubmissions(${index}, ${box.submissionCount})">View ${box.submissionCount} Submissions</button>
                        <div id="submissionsList-${index}" style="display:none; margin-top: 10px;">Loading submissions... (Requires new contract function)</div>
                    </div>` 
                    : ''}
            </div>
        `;
        listEl.appendChild(boxItem);
    }
    
    // --- STUDENT/MEMBER FUNCTION ---
    async function submitFileCID(index) {
        if (!fileRegistryContract) return alert("Please connect your wallet.");
        
        const cid = el(`cidInput-${index}`).value.trim();
        
        if (!cid) {
            showMsg(`submitStatus-${index}`, 'Please enter a valid IPFS CID.', false);
            return;
        }
        
        if (!confirm(`Are you sure you want to submit CID ${cid} to box #${index}? This cannot be changed.`)) return;

        try {
            showMsg(`submitStatus-${index}`, 'Sending transaction to submit CID... Confirm in MetaMask.', true, 0);
            
            // Use the submitFile function (CID is passed as fileName for simplicity)
            const tx = await fileRegistryContract.submitFile(index, cid);
            await tx.wait();
            
            showMsg(`submitStatus-${index}`, `✅ Submission successful! CID: ${cid}`, true, 10000);
            await loadSubmissionBoxes(); // Refresh the box to show status change
            
        } catch(err) {
            console.error("Submission Error:", err);
            showMsg(`submitStatus-${index}`, `❌ Submission Failed: ${err.error?.message || err.message}`, false);
        }
    }
    
    // Placeholder for Teacher/Admin function
    function viewSubmissions(boxId, count) {
        alert(`Functionality TBD: Listing ${count} submissions for Box #${boxId}. This requires a new view function in the contract to iterate over student submissions.`);
    }

    window.onload = init;

    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
    }
  </script>
</body>
</html>
